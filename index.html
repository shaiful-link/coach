<html lang="en">
<head>

<title>Habits Coach</title>

<style>
/* ---------- Theme: white cards and dark text on a soft background that changes by section ---------- */
:root{--bg:#c5daf0;--bg2:#d0e1f3;--card:#ffffff;--ink:#1c2836;--mute:#44535f;--line:#a9c1da;--acc:#2c5c88;--acc-ink:#fff;--soft:#e1ecf7;--warm:#fbefd9;--warm-ink:#4a3a22;--bad:#a04538;--shadow:0 1px 2px rgba(40,65,95,.10),0 6px 18px rgba(40,65,95,.10)}
@media (prefers-color-scheme:dark){:root{--bg:#10161d;--bg2:#121820;--card:#222d3a;--ink:#f0f4f8;--mute:#b3c0cd;--line:#3b4a5b;--acc:#a3c9ec;--acc-ink:#0f1c29;--soft:#2f3e4f;--warm:#40382a;--warm-ink:#f5e6c8;--bad:#f0a898;--shadow:0 1px 2px rgba(0,0,0,.3)}}
/* Section backgrounds: home = blue, questions = teal, likely why = lavender, respond = green, follow-up = peach, data = grey */
:root[data-sec=q]{--bg:#c4e3de;--line:#9fcac3}
:root[data-sec=why]{--bg:#d9d3ef;--line:#b9b0de}
:root[data-sec=respond]{--bg:#cde5cf;--line:#a8cfab}
:root[data-sec=follow]{--bg:#f2d9c6;--line:#ddbba1}
:root[data-sec=data]{--bg:#d9dee5;--line:#b9c3cf}
@media (prefers-color-scheme:dark){
:root[data-sec=q]{--bg:#0e1b1b;--line:#2f4a48}
:root[data-sec=why]{--bg:#171429;--line:#40395f}
:root[data-sec=respond]{--bg:#0f1b12;--line:#33503a}
:root[data-sec=follow]{--bg:#20160f;--line:#5a4332}
:root[data-sec=data]{--bg:#15181c;--line:#3a4048}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg);transition:background-color .35s}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);transition:background-color .35s;color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
/* ---------- Top bar ---------- */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg);transition:background-color .35s}
header h1{flex:1;margin:0;font-size:16px;font-weight:600;letter-spacing:.02em;color:var(--ink)}
.ib{border:1px solid var(--line);background:var(--card);color:var(--acc);border-radius:50%;width:44px;height:44px;padding:0;font:inherit;font-size:14px;font-weight:600;box-shadow:var(--shadow)}
main{max-width:560px;margin:0 auto;padding:14px 18px calc(40px + env(safe-area-inset-bottom))}
/* ---------- Text ---------- */
h2{font-size:23px;line-height:1.3;margin:4px 0 12px;font-weight:600;text-wrap:balance}
h3{font-size:13px;letter-spacing:.06em;color:var(--mute);margin:28px 0 10px;font-weight:600;text-transform:uppercase}
p{margin:0 0 12px}
.mute{color:var(--mute);font-size:15px}
.tag{display:inline-block;font-size:13px;font-weight:600;color:var(--acc);background:var(--soft);border-radius:999px;padding:4px 12px;margin-bottom:12px}
/* ---------- Lists and cards ---------- */
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:20px;padding:15px 18px;margin-bottom:12px;font:inherit;min-height:62px;box-shadow:var(--shadow)}
.row b{display:block;font-weight:600}
.row small{display:block;color:var(--mute);font-size:14px}
.row .g{flex:1;min-width:0}
.row .chev{color:var(--mute);font-size:22px}
/* case row on the home screen: open button plus a delete (bin) button beside it */
.crow{display:flex;gap:8px;align-items:stretch;margin-bottom:12px}
.crow .row{flex:1;min-width:0;margin-bottom:0}
.crow .row .chev{display:none}
.del{flex:none;width:52px;display:grid;place-items:center;background:var(--card);color:var(--bad);border:1.5px solid var(--line);border-radius:20px;padding:0;box-shadow:var(--shadow)}
.del:active{border-color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.warm{background:var(--warm);color:var(--warm-ink);border-color:transparent}
.warm .mute{color:inherit;opacity:.85}
.say{border-left:3px solid var(--acc);border-radius:2px;padding:4px 0 4px 16px;margin:6px 0 14px;font-size:19px;line-height:1.5}
.no{border-left-color:var(--bad)}
.chip{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap;background:var(--line);color:var(--mute)}
.chip.open{color:var(--acc);background:var(--soft)}
.chip.tried{color:var(--warm-ink);background:var(--warm)}
/* ---------- Buttons ---------- */
.ab{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;font:inherit;font-size:18px;min-height:78px;box-shadow:var(--shadow)}
.ab:active,.row:active{border-color:var(--acc);background:var(--soft)}
.ab i{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--acc);font-style:normal;font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:16px;margin-top:12px;font:inherit;font-weight:600;background:var(--acc);color:var(--acc-ink);min-height:56px}
.btn.sec{background:var(--soft);color:var(--acc)}
.btn.txt{background:transparent;color:var(--mute);font-weight:500;min-height:44px;padding:10px}
.btn.bad{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.cp{border:0;background:var(--soft);color:var(--acc);border-radius:999px;padding:8px 18px;font:inherit;font-size:14px;font-weight:600;min-height:40px}
button{transition:background .2s,border-color .2s}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input[type=text]{width:100%;font:inherit;padding:14px 16px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink)}
/* ---------- Progress ---------- */
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 22px}
.prog div{height:100%;background:var(--acc);border-radius:3px}
ul{margin:0 0 12px;padding-left:20px}
li{margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast,button,html,body,header{transition:none}}
</style>
</head>

/* Spoken lines (open, win, avoid, msg, need, next) use a normal Malaysian office register: not textbook, not pasar. */
/* ---------- 5. Causes for other people: why it happens and how to open ----------
   open has three wordings: side (peer / other dept / external), down (my staff), up (my boss) */
const CAUSE={
 unclear:{n:L("Unclear expectation","Jangkaan tidak jelas"),
  why:L("They may not be refusing. They may not know exactly what you need, by when, or how good is good enough.","Mereka mungkin bukan enggan. Mereka mungkin tidak tahu dengan tepat apa yang anda perlukan, bila, atau sebaik mana yang dikira cukup."),
  re:L("Not 'they won't do it', but 'we have not agreed what done looks like'.","Bukan 'mereka tak mahu buat', tetapi 'kita belum bersetuju bagaimana rupa siap'."),
  open:{side:L("I think I wasn't very clear earlier. Can I check what you understood from my request?","Saya rasa saya kurang jelas tadi. Boleh saya semak, apa yang awak faham daripada permintaan saya?"),
        down:L("I just want to check that I explained it clearly. Could you tell me how you understand the request?","Saya nak pastikan penerangan saya jelas. Boleh awak terangkan semula, apa yang awak faham tentang permintaan ini?"),
        up:L("I'd like to make sure I understood correctly. What would a good result look like for you?","Saya nak pastikan saya faham dengan betul. Hasil yang baik itu macam mana ya?")},
  win:L("Let's write it down: what, by when, and who. That way nobody has to chase.","Apa kata kita tulis: apa, bila dan siapa. Jadi tak ada siapa perlu kejar."),
  avoid:L("I already told you.","Saya dah beritahu tadi."),
  msg:L("Hi, I think I wasn't very clear earlier. I need [what] by [when], for [why]. Is that okay? Let me know if anything is unclear.","Hai, saya rasa saya kurang jelas tadi. Saya perlukan [apa] sebelum [bila], untuk [sebab]. Boleh ke? Beritahu saya kalau ada yang kurang jelas."),
  retry:L("Put it in writing: one line each for what, when and who. Ask them to reply with what they will do.","Tulis secara bertulis: satu baris untuk apa, bila dan siapa. Minta mereka balas dengan apa yang mereka akan buat.")},
 priorities:{n:L("Competing priorities","Keutamaan bertembung"),
  why:L("They may not be refusing you. Something else, often from their own boss, comes first.","Mereka mungkin bukan menolak anda. Ada perkara lain, selalunya daripada ketua mereka sendiri, yang didahulukan."),
  re:L("Not 'they ignore me', but 'my request is losing to another priority'.","Bukan 'mereka abaikan saya', tetapi 'permintaan saya kalah kepada keutamaan lain'."),
  open:{side:L("I know you have a lot on your plate. What is taking most of your time this week?","Saya tahu awak banyak kerja sekarang. Minggu ini, apa yang paling banyak ambil masa awak?"),
        down:L("What are you working on right now? Which tasks are competing for the same time?","Apa kerja yang awak sedang buat sekarang? Yang mana bertembung masa?"),
        up:L("I can see things are moving fast. Which one is the top priority for you this week?","Saya nampak banyak perkara bergerak serentak. Minggu ini, yang mana paling utama?")},
  win:L("If I prepare [part] first, would that make it faster for you? Or which date is realistic?","Kalau saya sediakan [bahagian] dulu, lebih cepat tak untuk awak? Atau tarikh mana yang realistik?"),
  avoid:L("It only takes five minutes.","Lima minit saja."),
  msg:L("Hi, I know you're busy. I need [what] by [when]. If that date is difficult, which date works for you? I can prepare [part] first to speed things up.","Hai, saya tahu awak sibuk. Saya perlukan [apa] sebelum [bila]. Kalau tarikh itu susah, tarikh mana yang sesuai? Saya boleh sediakan [bahagian] dulu supaya lebih cepat."),
  retry:L("Ask which date they can commit to, and take the smallest useful piece first. If it truly cannot fit, agree together who should decide the priority.","Tanya tarikh mana yang mereka boleh janji, dan ambil bahagian terkecil yang berguna dahulu. Jika memang tidak muat, setuju bersama siapa yang patut tentukan keutamaan.")},
 nowin:{n:L("No win for them","Tiada manfaat untuk mereka"),
  why:L("The task helps you but costs them time or risk. People put effort where they see a benefit.","Tugasan itu membantu anda tetapi memakan masa atau risiko mereka. Orang beri usaha di tempat mereka nampak manfaat."),
  re:L("Not 'they are selfish', but 'I have not shown what is in it for them'.","Bukan 'mereka pentingkan diri', tetapi 'saya belum tunjuk apa manfaatnya untuk mereka'."),
  open:{side:L("I understand this is extra work for you. What would make it worth your time?","Saya faham ini kerja tambahan untuk awak. Apa yang boleh buat ia berbaloi untuk awak?"),
        down:L("Which part of this feels like it doesn't benefit you? You can be open with me.","Bahagian mana yang awak rasa tak memberi manfaat kepada awak? Awak boleh berterus terang dengan saya."),
        up:L("I'd like this to support your targets as well. Which of your goals should it help?","Saya nak perkara ini turut menyokong sasaran jabatan. Matlamat yang mana patut ia bantu?")},
  win:L("How about this: you get [benefit], and I get [what I need]. Does that work?","Macam mana kalau begini: awak dapat [manfaat], saya dapat [apa yang saya perlukan]. Okey tak?"),
  avoid:L("It's your job.","Ini memang kerja awak."),
  msg:L("Hi, I understand [what] is extra work for you. I'd like to find a way that helps you too, for example [benefit]. Can we talk for 10 minutes?","Hai, saya faham [apa] kerja tambahan untuk awak. Saya nak cari cara yang membantu awak juga, contohnya [manfaat]. Boleh kita bincang 10 minit?"),
  retry:L("Ask what they are measured on and link your request to it. If there is truly no benefit for them, ask for less, or let both managers set the priority.","Tanya apa yang mereka diukur dan kaitkan permintaan anda dengannya. Jika memang tiada manfaat untuk mereka, kurangkan permintaan, atau biar kedua-dua pengurus tentukan keutamaan.")},
 trust:{n:L("Trust or a past issue","Isu kepercayaan atau kisah lama"),
  why:L("The problem may be between the two of you, not the task. A past incident or low trust makes people hold back.","Masalahnya mungkin antara anda berdua, bukan tugasan itu. Kejadian lama atau kurang percaya membuat orang menahan diri."),
  re:L("Not 'they are difficult', but 'something between us needs repair'.","Bukan 'mereka susah', tetapi 'ada sesuatu antara kami yang perlu dibaiki'."),
  open:{side:L("I feel things haven't been smooth between us, and I may have a part in that. Can we talk about it?","Saya rasa hubungan kerja kita kurang lancar, dan mungkin saya pun ada silap. Boleh kita bincang sekejap?"),
        down:L("I want you to feel comfortable telling me anything, including bad news. Is there anything I do that makes that difficult?","Saya nak awak selesa beritahu saya apa sahaja, termasuk berita kurang baik. Ada tak apa-apa yang saya buat yang menyukarkan awak?"),
        up:L("I want us to work well together. Is there anything I did that affected your confidence in me?","Saya nak kerja kita berjalan dengan baik. Ada tak apa-apa yang saya buat yang menjejaskan keyakinan terhadap saya?")},
  win:L("Tell me one thing I could do differently. I'll also share one thing that would help me.","Beritahu satu perkara yang saya boleh ubah. Saya juga akan kongsi satu perkara yang boleh membantu saya."),
  avoid:L("What's your problem with me?","Apa masalah awak dengan saya?"),
  msg:L("Hi, I feel things haven't been smooth between us and I'd like to fix that. Are you free for a coffee, about 15 minutes?","Hai, saya rasa hubungan kerja kita kurang lancar dan saya nak perbaikinya. Awak free tak untuk minum kopi, dalam 15 minit?"),
  retry:L("Do not push for an answer in one talk. Keep one small promise to them this week, then ask again. Trust returns through small kept promises.","Jangan desak jawapan dalam satu perbualan. Tunaikan satu janji kecil kepada mereka minggu ini, kemudian tanya semula. Kepercayaan pulih melalui janji kecil yang ditunaikan.")},
 skill:{n:L("Skill, confidence or information gap","Jurang kemahiran, keyakinan atau maklumat"),
  why:L("They may want to do it but not know how, or be afraid of doing it wrong. Many people hide this rather than ask.","Mereka mungkin mahu buat tetapi tidak tahu caranya, atau takut tersalah. Ramai orang menyembunyikannya daripada bertanya."),
  re:L("Not 'they are lazy', but 'they may be stuck and not saying so'.","Bukan 'mereka malas', tetapi 'mereka mungkin tersekat dan tidak memberitahu'."),
  open:{side:L("Which part is the trickiest? I got stuck on it too the first time.","Bahagian mana yang paling rumit? Saya pun tersekat masa kali pertama buat."),
        down:L("Which part are you comfortable with, and which part are you less sure about?","Bahagian mana yang awak yakin, dan bahagian mana yang awak kurang pasti?"),
        up:L("Would it help if I prepare the background and options first, so it's easier to decide?","Kalau saya sediakan latar belakang dan pilihan dulu, adakah lebih mudah untuk buat keputusan?")},
  win:L("Let's do the first one together, then you try the next one and I'll check. Okay?","Kita buat yang pertama sama-sama, lepas itu awak cuba yang seterusnya dan saya semak. Okey?"),
  avoid:L("It's easy, anyone can do it.","Senang saja, semua orang boleh buat."),
  msg:L("Hi, about [what]: if any part is unclear or new to you, just let me know. I can go through the first one with you.","Hai, tentang [apa]: kalau ada bahagian yang kurang jelas atau baru bagi awak, beritahu saya. Saya boleh buat yang pertama bersama awak."),
  retry:L("Break it into a smaller first step and show an example of a finished one. Check after the first step, not at the deadline.","Pecahkan kepada langkah pertama yang lebih kecil dan tunjuk satu contoh yang sudah siap. Semak selepas langkah pertama, bukan pada tarikh akhir.")},
 system:{n:L("System or process barrier","Halangan sistem atau proses"),
  why:L("The person may be willing, but the process, tool, access or approval is in the way. Anyone in that seat would behave the same.","Orang itu mungkin sanggup, tetapi proses, alat, akses atau kelulusan menjadi penghalang. Sesiapa di tempat itu akan berkelakuan sama."),
  re:L("Not 'they are slow', but 'the system makes this hard to do'.","Bukan 'mereka lambat', tetapi 'sistem menyukarkan perkara ini'."),
  open:{side:L("What is holding it up on your side? There may be something in the process I'm not seeing.","Apa yang menghalang di pihak awak? Mungkin ada sesuatu dalam proses yang saya tak nampak."),
        down:L("What is holding you up? Tools, access, approval, or waiting for someone?","Apa yang menghalang awak? Peralatan, akses, kelulusan, atau menunggu seseorang?"),
        up:L("I think the issue is in the process, not the people. Can I show you where it gets stuck?","Saya rasa masalahnya pada proses, bukan pada orang. Boleh saya tunjukkan di mana ia tersekat?")},
  win:L("If we fix this together, it saves both of us time every time. Who else should we involve?","Kalau kita selesaikan sama-sama, kita berdua jimat masa setiap kali. Siapa lagi yang perlu kita libatkan?"),
  avoid:L("Just find a way.","Cari jalan sendiri."),
  msg:L("Hi, I think [what] is stuck somewhere in the process. Where does it stop on your side? I'd like to help clear it.","Hai, saya rasa [apa] tersekat di mana-mana dalam proses. Di pihak awak, ia terhenti di mana? Saya nak bantu selesaikan."),
  retry:L("Go through the steps together and mark where it stops. Take that one blocker to the process owner, with an example.","Lalui langkah-langkah itu bersama dan tandakan di mana ia terhenti. Bawa satu halangan itu kepada pemilik proses, dengan contoh.")},
 mypart:{n:L("My own part","Bahagian saya sendiri"),
  why:L("How, when or where you asked may be part of it. A rushed message, a late request or a sharp tone can create resistance.","Cara, masa atau tempat anda meminta mungkin sebahagian puncanya. Mesej tergesa-gesa, permintaan lewat atau nada keras boleh menimbulkan penolakan."),
  re:L("Not 'what is wrong with them', but 'what can I change in how I ask'.","Bukan 'apa masalah mereka', tetapi 'apa yang saya boleh ubah dalam cara saya meminta'."),
  open:{side:L("I think I rushed you the other day, sorry about that. Can I start again and explain properly?","Saya rasa saya terlalu mendesak hari itu, minta maaf. Boleh saya mula semula dan terangkan dengan betul?"),
        down:L("I may not have given you enough time or detail. What could I do differently to make it easier for you?","Mungkin saya tak beri masa atau maklumat yang cukup. Apa yang saya boleh ubah supaya lebih mudah untuk awak?"),
        up:L("I don't think I explained this well last time. Could I have 10 minutes to go through it again?","Saya rasa penerangan saya kurang jelas hari itu. Boleh saya ambil 10 minit untuk terangkan semula?")},
  win:L("Let me know the best way and time to bring requests to you, and I'll follow that.","Beritahu saya cara dan masa yang paling sesuai untuk saya kemukakan permintaan, dan saya akan ikut."),
  avoid:L("I'm sorry, but you also...","Saya minta maaf, tapi awak pun..."),
  msg:L("Hi, sorry, my earlier request was a bit rushed. To be clear: I need [what] by [when] because [why]. What do you think?","Hai, maaf, permintaan saya tadi agak tergesa-gesa. Supaya jelas: saya perlukan [apa] sebelum [bila] kerana [sebab]. Apa pendapat awak?"),
  retry:L("Change one thing: the timing, the channel or the amount of notice. Ask them directly how they prefer to be asked.","Ubah satu perkara: masa, saluran atau tempoh notis. Tanya terus bagaimana mereka lebih suka diminta.")},

 /* ---------- 6. Causes for "Myself": steps are [habit number, title, what to do] ---------- */
 s_goal:{n:L("Unclear end result","Hasil akhir tidak jelas"),
  why:L("It is hard to start when you cannot picture what finished looks like.","Sukar untuk bermula apabila anda tidak dapat bayangkan rupa siap."),
  re:L("Not 'I am lazy', but 'I have not defined done'.","Bukan 'saya malas', tetapi 'saya belum tentukan apa itu siap'."),
  steps:[[2,L("Define done","Tentukan apa itu siap"),L("Write one sentence: this is finished when ...","Tulis satu ayat: perkara ini siap apabila ...")],
         [3,L("Pick the first step","Pilih langkah pertama"),L("Choose a step small enough to do in 15 minutes. Do only that.","Pilih langkah yang cukup kecil untuk dibuat dalam 15 minit. Buat itu sahaja.")],
         [1,L("Start before you feel ready","Mula sebelum rasa bersedia"),L("Set a 15-minute timer and begin. Motivation follows action.","Set pemasa 15 minit dan mula. Motivasi datang selepas tindakan.")],

   9. State and storage
   ===================================================================== */
const KEY="habitsCoach.v1";
let S={lang:"en",cases:[]};      // saved state
let V={name:"home"};             // current screen
let C=null;                      // current case
let COPY=[];                     // texts for the copy buttons on this screen
try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&Array.isArray(r.cases))S=r;}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const t=x=>x[S.lang==="bm"?1:0];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
const isSelf=c=>CAT[c.cat].tone==="self";

/* ---------- Question queue: follow-up questions are inserted after the answer that triggers them ---------- */
function queue(c){
  const q=[...SIT[c.sit].q];
  for(let i=0;i<c.ans.length&&i<q.length;i++){
    const f=Q[q[i]][c.ans[i]].f;
    if(f&&!q.includes(f))q.splice(i+1,0,f);
  }
  return q;
}
/* ---------- Scoring: add the points of every answer, highest cause first ---------- */
function rank(c){
  const order=isSelf(c)?SORDER:ORDER, def=isSelf(c)?SDEF:DEF, sc={}, q=queue(c);
  order.forEach(k=>sc[k]=0);
  c.ans.forEach((a,i)=>{const p=Q[q[i]][a].p;for(const k in p)sc[k]+=p[k];});
  const top=Math.max(...order.map(k=>sc[k]));
  c.flat=top===0;
  c.rank=c.flat?def.concat(order.filter(k=>!def.includes(k))):order.slice().sort((x,y)=>sc[y]-sc[x]);
  c.second=!c.flat&&sc[c.rank[1]]>0;
  c.ci=0;
}
/* ---------- Response steps for the current cause ---------- */
function steps(c){
  const cz=CAUSE[c.rank[c.ci]], tone=CAT[c.cat].tone;
  if(tone==="self")return cz.steps.map(s=>({h:s[0],t:s[1],x:s[2],say:false}));
  return [{h:5,t:T.s_open,x:cz.open[tone],say:true},{h:2,t:T.s_need,x:TONE[tone].need,say:true},
          {h:4,t:T.s_win,x:cz.win,say:true},{h:3,t:T.s_next,x:TONE[tone].next,say:true}];
}
/* ---------- Which screen a saved case should open on ---------- */
function viewOf(c){
  if(c.stage==="q")return "q";
  if(c.stage==="why")return "why";
  if(c.stage==="respond")return c.step<0?"calm":c.step>=steps(c).length?"ready":"step";
  if(c.stage==="react")return "react";
  return "good";
}
const go=n=>{V={name:n};render();};
const goCase=()=>{save();go(viewOf(C));};

  }

  else if(v==="q"){
    const q=queue(C), i=C.ans.length, qq=Q[q[i]];
    h+=`<p class="mute">${esc(C.label||t(SIT[C.sit].n))} · ${i+1} ${t(T.of)} ${q.length}</p><div class="prog"><div style="width:${Math.round(i/q.length*100)}%"></div></div>
    <h2>${t(qq.q)}</h2>${ab("ans:a","A",t(qq.a.t))}${ab("ans:b","B",t(qq.b.t))}`;
  }

  else if(v==="why"){
    const cz=CAUSE[C.rank[C.ci]];
    h+=`<span class="tag">${t(HABIT[5])}</span>`;
    if(C.flat&&C.ci===0)h+=`<p class="mute">${t(T.flat)}</p>`;
    h+=`<div class="card warm"><p class="mute">${t(T.why1)}</p><h2>${t(cz.n)}</h2><p style="margin:0">${t(cz.why)}</p></div>
    <div class="card"><p class="mute">${t(T.reframe)}</p><p style="margin:0">${t(cz.re)}</p></div>`;
    if(C.second&&C.ci===0)h+=`<p class="mute">${t(T.why2)}: <b>${t(CAUSE[C.rank[1]].n)}</b></p>`;
    h+=`<p class="mute">${t(T.guess)}</p><button class="btn" data-a="respond">${t(T.torespond)}</button><button class="btn sec" data-a="nextr">${t(T.other)}</button>`;
  }

  else if(v==="calm"){
    h+=`<span class="tag">${t(HABIT[1])}</span><h2>${t(T.calm)}</h2>${ab("calm:a","A",t(T.calm_a))}${ab("calm:b","B",t(T.calm_b))}`;
  }

  else if(v==="reset"){
    h+=`<span class="tag">${t(HABIT[1])}</span><h2>${t(T.reset)}</h2><div class="card"><ul>${T.reset_l.map(x=>`<li>${t(x)}</li>`).join("")}</ul></div>
    <button class="btn" data-a="calm:a">${t(T.calmnow)}</button><button class="btn sec" data-a="home">${t(T.later)}</button>`;
  }

  else if(v==="step"){
    const st=steps(C), s=st[C.step];
    h+=`<p class="mute">${t(T.step)} ${C.step+1} ${t(T.of)} ${st.length} · ${t(CAUSE[C.rank[C.ci]].n)}</p><div class="prog"><div style="width:${Math.round((C.step+1)/st.length*100)}%"></div></div>
    <span class="tag">${t(HABIT[s.h])}</span><h2>${t(s.t)}</h2>`;
    if(s.say)h+=`<div class="card"><p class="mute">${t(T.sayit)}</p>${sayBox(t(s.x))}${copyBtn()}</div>${/\[/.test(t(s.x))?`<p class="mute">${t(T.brackets)}</p>`:""}`;
    else h+=`<div class="card"><p style="margin:0;font-size:19px">${t(s.x)}</p></div>`;
    h+=`<button class="btn" data-a="next">${t(T.next)}</button>`;
  }

  else if(v==="ready"){
    const cz=CAUSE[C.rank[C.ci]], self=isSelf(C);
    h+=`<h2>${t(T.ready)}</h2><div class="card"><p class="mute">${t(self?T.avoid_s:T.avoid)}</p><div class="say no" style="margin-bottom:0">${t(cz.avoid)}</div></div>`;
    if(!self)h+=`<div class="card"><p class="mute">${t(T.asmsg)}</p>${sayBox(t(cz.msg))}${copyBtn()}</div>`;
    h+=`<div class="card warm"><p class="mute">${t(T.remember)}</p><p style="margin:0">${t(CAT[C.cat].tip)}</p></div>
    <button class="btn" data-a="savego">${t(T.savego)}</button><p class="mute" style="margin-top:10px">${t(self?T.savego_ns:T.savego_n)}</p>`;
  }

  else if(v==="react"){
    const self=isSelf(C);
    h+=`<p class="mute">${esc(C.label||t(SIT[C.sit].n))} · ${t(CAUSE[C.rank[C.ci]].n)}</p><h2>${t(self?T.react_s:T.react)}</h2>
    ${ab("react:a","A",t(self?T.react_sa:T.react_a))}${ab("react:b","B",t(self?T.react_sb:T.react_b))}
    <button class="btn txt" data-a="again">${t(T.again)}</button><button class="btn txt" data-a="del:${C.id}">${t(T.del)}</button>`;
  }

  else if(v==="good"){
    const self=isSelf(C);
    h+=`<span class="tag">${t(HABIT[7])}</span><h2>${t(self?T.st_resolved:T.good)}</h2>
    <div class="card">${self?`<p style="margin:0">${t(T.good_s)}</p>`:`<ul style="margin:0">${T.good_l.map(x=>`<li>${t(x)}</li>`).join("")}</ul>`}</div>
    <p class="mute">${t(T.why1)}: <b>${t(CAUSE[C.rank[C.ci]].n)}</b></p>
    <button class="btn" data-a="home">${t(T.home)}</button><button class="btn txt" data-a="del:${C.id}">${t(T.del)}</button>`;
  }

  else if(v==="retry"){
    const cz=CAUSE[C.rank[C.ci]], self=isSelf(C), nx=CAUSE[C.rank[(C.ci+1)%C.rank.length]];
    h+=`<span class="tag">${t(HABIT[self?1:5])}</span><h2>${t(self?T.retry_s:T.retry)}</h2><div class="card"><p style="margin:0">${t(cz.retry)}</p></div>`;
    if(V.esc)h+=`<div class="card warm"><p class="mute">${t(T.esc)}</p><p style="margin:0">${t(TONE[CAT[C.cat].tone].esc)}</p></div>`;
    h+=`<button class="btn" data-a="nextr">${t(T.nextr)}: ${t(nx.n)}</button>`;
    if(!self&&!V.esc)h+=`<button class="btn sec" data-a="esc">${t(T.esc)}</button>`;
    h+=`<button class="btn txt" data-a="home">${t(T.close)}</button>`;
  }

  else if(v==="data"){
    h+=`<h2>${t(T.data)}</h2><p>${t(T.data_t)}</p><p class="mute">${S.cases.length?S.cases.length+" "+t(T.mine).toLowerCase():t(T.nocase)}</p>
    <button class="btn" data-a="exp">${t(T.exp)}</button><button class="btn sec" data-a="imp">${t(T.imp)}</button><button class="btn bad" data-a="clear">${t(T.clear)}</button>`;
  }

  $("app").innerHTML=h;
  window.scrollTo(0,0);
}

/* =====================================================================
   11. Actions
   ===================================================================== */
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1500);}
function copyText(s){
  const ok=()=>toast(t(T.copied));
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(ok,()=>fallback());}else fallback();
  function fallback(){const a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok();}catch(e){}a.remove();}
}
function removeCase(id){S.cases=S.cases.filter(c=>c.id!==id);save();}

function act(a){
  const i=a.indexOf(":"), name=i<0?a:a.slice(0,i), arg=i<0?"":a.slice(i+1);
  switch(name){
    case "lang": S.lang=S.lang==="bm"?"en":"bm";save();render();break;
    case "home": save();C=null;go("home");break;
    case "data": go("data");break;
    case "cat": V={name:"cat",cat:arg};render();break;
    case "sit": V={name:"pause",sit:arg,cat:SIT[arg].c};render();break;
    case "start":                                  // create and save a new case
      C={id:Date.now().toString(36),cat:SIT[V.sit].c,sit:V.sit,label:$("lbl").value.trim(),ts:Date.now(),ans:[],rank:[],ci:0,stage:"q",step:0,status:"open"};
      S.cases.push(C);goCase();break;
    case "ans":                                    // record A or B, then score when all are answered
      C.ans.push(arg);
      if(C.ans.length>=queue(C).length){rank(C);C.stage="why";}
      goCase();break;
    case "respond": C.stage="respond";C.step=isSelf(C)?0:-1;goCase();break;
    case "calm": if(arg==="a"){C.step=0;goCase();}else go("reset");break;
    case "next": C.step++;goCase();break;
    case "savego": C.stage="react";save();C=null;go("home");break;
    case "open": C=S.cases.find(c=>c.id===arg);if(C)go(viewOf(C));break;
    case "again": C.stage="respond";C.step=0;goCase();break;
    case "react":
      if(arg==="a"){C.status="resolved";C.stage="done";goCase();}
      else{C.status="tried";save();go("retry");}
      break;
    case "nextr": C.ci=(C.ci+1)%C.rank.length;C.stage="why";goCase();break;
    case "esc": V={name:"retry",esc:true};render();break;
    case "copy": copyText(COPY[+arg]);break;
    case "del": if(confirm(t(T.del_q))){removeCase(arg);C=null;go("home");}break;
    case "clear": if(S.cases.length&&confirm(t(T.clear_q))){S.cases=[];save();render();}break;
    case "exp":{                                   // download the cases as a small JSON file
      const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),u=URL.createObjectURL(b),l=document.createElement("a");
      l.href=u;l.download="habits-coach-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);break;}
    case "imp": $("imp").click();break;
    case "back": back();break;
  }
}
/* ---------- Back button: one step back on every screen ---------- */
function back(){
  const v=V.name;
  if(v==="cat"||v==="data"||v==="react"||v==="good")return act("home");
  if(v==="pause"){V={name:"cat",cat:V.cat};return render();}
  if(v==="q"){
    if(C.ans.length){C.ans.pop();return goCase();}
    const s=C.sit;removeCase(C.id);C=null;V={name:"pause",sit:s,cat:SIT[s].c};return render();   // nothing answered yet: drop the empty case
  }
  if(v==="why"){
    if(C.ci>0){C.ci--;return goCase();}
    C.ans.pop();C.stage="q";return goCase();
  }
  if(v==="calm"){C.stage="why";return goCase();}
  if(v==="reset")return go("calm");
  if(v==="step"){
    if(C.step>0)C.step--;else if(!isSelf(C))C.step=-1;else C.stage="why";
    return goCase();
  }
  if(v==="ready"){C.step=steps(C).length-1;return goCase();}
  if(v==="retry")return go("react");
  act("home");
}

/* ---------- Wire up ---------- */
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b)act(b.dataset.a);});
$("imp").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      const good=d&&Array.isArray(d.cases)&&d.cases.every(c=>c&&SIT[c.sit]&&CAT[c.cat]&&Array.isArray(c.ans)&&Array.isArray(c.rank)&&c.rank.every(k=>CAUSE[k]));
      if(!good)throw 0;
      if(confirm(t(T.imp_q))){S={lang:S.lang,cases:d.cases};save();C=null;go("home");toast(t(T.imp_ok));}
    }catch(x){toast(t(T.imp_bad));}
    e.target.value="";
  };
  r.readAsText(f);
});
/* Offline support: only works when the page is served over https (GitHub Pages) */
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
