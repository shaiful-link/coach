 m6:{sc:L("Under pressure from above or a customer, some managers correct on the spot without thinking about who is listening.","Bila ditekan dari atas atau oleh pelanggan, sesetengah ketua menegur serta-merta tanpa memikirkan siapa yang mendengar."),op:L("I accept the mistake was mine, and I will fix it. Next time, could we discuss it one-to-one? I take it in better that way.","Saya terima kesilapan itu salah saya, dan saya akan betulkan. Lain kali, boleh kita bincang secara berdua? Saya lebih mudah terima begitu."),idea:L("Raise it privately a day later, when both are calm. Own your part first, then make the request.","Bangkitkan secara tertutup sehari kemudian, bila kedua-dua tenang. Akui bahagian anda dahulu, kemudian buat permintaan.")},
 m7:{sc:L("Late requests often arrive after an evening call with overseas offices or a customer in another time zone.","Permintaan lewat selalunya datang selepas panggilan petang dengan pejabat luar negara atau pelanggan di zon masa lain."),op:L("A few urgent tasks came in after 5 pm this month. Can we look at where they come from, so I can prepare earlier?","Beberapa tugasan segera masuk selepas 5 petang bulan ini. Boleh kita tengok dari mana ia datang, supaya saya boleh bersedia lebih awal?"),idea:L("Ask for a quick heads-up when a late request is likely, and prepare a template for the common ones.","Minta makluman awal bila permintaan lewat dijangka, dan sediakan templat untuk yang biasa diminta.")},
 m8:{sc:L("Managers often see only the final result. If they did not see the work behind it, they cannot mention it.","Ketua selalunya hanya nampak hasil akhir. Jika mereka tidak nampak kerja di sebaliknya, mereka tidak dapat menyebutnya."),op:L("I would like to share what went into the project, because I learned a few things that may be useful for the team.","Saya nak kongsi apa yang dibuat di sebalik projek itu, kerana ada beberapa perkara yang saya belajar yang mungkin berguna untuk pasukan."),idea:L("Send a short monthly summary of what you delivered and the result. It makes your work easy to quote.","Hantar ringkasan bulanan yang pendek tentang apa yang anda siapkan dan hasilnya. Ia memudahkan kerja anda disebut.")},
 d1:{sc:L("Other departments rank work by their own targets and their own boss. A request that comes by email with no date sits at the bottom.","Jabatan lain menyusun kerja mengikut sasaran dan ketua mereka sendiri. Permintaan melalui emel tanpa tarikh akan berada di bawah sekali."),op:L("I sent a request a few days ago and I am not sure where it stands. Can you tell me how your team handles requests like this?","Saya ada hantar permintaan beberapa hari lepas dan tak pasti statusnya. Boleh beritahu macam mana pasukan awak uruskan permintaan seperti ini?"),idea:L("Ask who the right contact person is and what lead time they need, then use that every time.","Tanya siapa orang yang betul untuk dihubungi dan berapa tempoh masa yang mereka perlukan, kemudian guna itu setiap kali.")},
 d2:{sc:L("When an issue crosses two departments, each sees only its own part. Sending it back is often a sign that ownership is unclear.","Bila satu isu melibatkan dua jabatan, setiap pihak hanya nampak bahagian sendiri. Memulangkannya selalunya tanda pemilikan tidak jelas."),op:L("This issue has gone back and forth between us twice. Can we sit for 15 minutes and map who does which part?","Isu ini sudah berulang-alik antara kita dua kali. Boleh kita duduk 15 minit dan petakan siapa buat bahagian mana?"),idea:L("Draw the steps on one page with a name beside each, and share it with both managers.","Lukis langkah-langkah dalam satu muka dengan nama di sebelah setiap satu, dan kongsi dengan kedua-dua ketua.")},
 d3:{sc:L("Data may be held back because of confidentiality rules, fear that it will be used against them, or the effort to extract it.","Data mungkin ditahan kerana peraturan kerahsiaan, takut ia digunakan terhadap mereka, atau kerana susah untuk dikeluarkan."),op:L("I understand the report may be sensitive. Can I explain what I need it for, and you tell me what can be shared?","Saya faham laporan itu mungkin sensitif. Boleh saya terangkan untuk apa saya perlukannya, dan awak beritahu apa yang boleh dikongsi?"),idea:L("Ask for only the fields you need, and offer to share your analysis back with them.","Minta hanya medan yang anda perlukan, dan tawarkan untuk kongsi semula analisis anda dengan mereka.")},
 d4:{sc:L("Actions agreed in a meeting are forgotten once people return to their own department's urgent work.","Tindakan yang dipersetujui dalam mesyuarat dilupakan sebaik sahaja orang kembali kepada kerja segera jabatan sendiri."),op:L("On the action we agreed on Monday, I have not seen an update. Is it still possible, or has something changed?","Tentang tindakan yang kita setuju pada hari Isnin, saya belum nampak kemas kini. Masih boleh dibuat, atau ada perubahan?"),idea:L("End each meeting by reading out the actions with names and dates, and send them the same day.","Akhiri setiap mesyuarat dengan membaca tindakan berserta nama dan tarikh, dan hantar pada hari yang sama.")},
 d5:{sc:L("Their requirement may have changed because their own customer or boss changed it. They are passing the change along.","Keperluan mereka mungkin berubah kerana pelanggan atau ketua mereka sendiri mengubahnya. Mereka hanya menyampaikan perubahan itu."),op:L("The request has changed since we confirmed the scope. Can you help me understand what changed on your side?","Permintaan ini sudah berubah sejak kita sahkan skop. Boleh bantu saya faham apa yang berubah di pihak awak?"),idea:L("Agree a simple rule: a change after sign-off comes with a new date.","Setuju satu peraturan mudah: perubahan selepas pengesahan datang dengan tarikh baru.")},
 d6:{sc:L("Some people go to the manager because they think only the manager can decide, or because an earlier attempt with you did not work.","Sesetengah orang pergi kepada ketua kerana fikir hanya ketua boleh memutuskan, atau kerana cubaan sebelum ini dengan anda tidak berjaya."),op:L("I heard the issue was raised with my manager. I would like to help directly. Can you tell me what you need?","Saya dengar isu itu dibangkitkan kepada ketua saya. Saya nak bantu secara terus. Boleh beritahu apa yang awak perlukan?"),idea:L("Tell them what you can decide yourself and how fast you respond, so coming to you is the quicker way.","Beritahu apa yang anda boleh putuskan sendiri dan berapa cepat anda memberi respons, supaya datang kepada anda ialah cara yang lebih pantas.")},
 d7:{sc:L("If a meeting does not help their own targets, it loses to production issues, audits and their own department's meetings.","Jika mesyuarat tidak membantu sasaran mereka sendiri, ia kalah kepada isu pengeluaran, audit dan mesyuarat jabatan sendiri."),op:L("I noticed your team could not join the last few meetings. Is the time or the agenda not working for you?","Saya perasan pasukan awak tidak dapat hadir beberapa mesyuarat lepas. Masa atau agendanya kurang sesuai ke?"),idea:L("Send the agenda early with the one item that needs them, and let them join only for that part.","Hantar agenda awal dengan satu perkara yang perlukan mereka, dan benarkan mereka hadir untuk bahagian itu sahaja.")},
 d8:{sc:L("New or shared tasks often fall between two department scopes. Each side truly believes it belongs to the other.","Tugasan baru atau bersama selalunya jatuh di antara skop dua jabatan. Setiap pihak benar-benar percaya ia milik pihak satu lagi."),op:L("It looks like this task sits between our two teams. Can we work out a fair split before it gets escalated?","Nampaknya tugasan ini berada di antara dua pasukan kita. Boleh kita cari pembahagian yang adil sebelum ia dibawa ke atas?"),idea:L("Split it by step: who starts, who checks, who closes. Then ask both managers to confirm.","Bahagikan mengikut langkah: siapa mula, siapa semak, siapa tutup. Kemudian minta kedua-dua ketua sahkan.")},
 e1:{sc:L("Late delivery often starts earlier: a late PO, a forecast change, a raw material shortage or shipping delays.","Penghantaran lewat selalunya bermula lebih awal: PO lewat, perubahan ramalan, kekurangan bahan mentah atau kelewatan penghantaran."),op:L("Three of the last five deliveries were late. I want to understand the cause on your side, and whether anything on our side adds to it.","Tiga daripada lima penghantaran terakhir lewat. Saya nak faham puncanya di pihak tuan, dan sama ada ada sesuatu di pihak kami yang menyumbang."),idea:L("Share a rolling forecast and agree a firm lead time. Ask for a warning as soon as a delay is known.","Kongsi ramalan bergulir dan setuju tempoh masa yang tetap. Minta amaran sebaik sahaja kelewatan diketahui.")},
 e2:{sc:L("The salesperson you email may not be the person who can solve a quality or technical issue.","Jurujual yang anda emel mungkin bukan orang yang boleh menyelesaikan isu kualiti atau teknikal."),op:L("We sent two complaints this month and have not had a reply. Who is the right person on your side to handle this?","Kami menghantar dua aduan bulan ini dan belum menerima jawapan. Siapa orang yang betul di pihak tuan untuk menguruskannya?"),idea:L("Use their formal complaint channel with a reference number, and agree a response time in writing.","Guna saluran aduan rasmi mereka dengan nombor rujukan, dan setuju tempoh respons secara bertulis.")},
 e3:{sc:L("Your contact may be relaying changes from their own customer, engineering team or regulator.","Orang hubungan anda mungkin menyampaikan perubahan daripada pelanggan, pasukan kejuruteraan atau badan kawal selia mereka sendiri."),op:L("The specification has changed twice since sign-off. Can we go through what is driving the changes?","Spesifikasi sudah berubah dua kali sejak disahkan. Boleh kita lihat apa yang mendorong perubahan itu?"),idea:L("Agree a change request form that shows the effect on cost and delivery date before work restarts.","Setuju satu borang permintaan perubahan yang menunjukkan kesan pada kos dan tarikh penghantaran sebelum kerja disambung.")},
 e4:{sc:L("An angry customer is usually under pressure from their own line being down or their own boss asking for answers.","Pelanggan yang marah biasanya sedang ditekan kerana line mereka terhenti atau ketua mereka meminta jawapan."),op:L("I can hear this has caused you a real problem. Let me make sure I understand it fully, then I will tell you what we can do today.","Saya faham perkara ini menyusahkan pihak tuan. Biar saya pastikan saya faham sepenuhnya, kemudian saya beritahu apa yang kami boleh buat hari ini."),idea:L("Give one contact person and a fixed time for the next update, and keep to it even if there is no news.","Beri seorang pegawai untuk dihubungi dan masa tetap untuk kemas kini seterusnya, dan patuhi walaupun tiada berita baru.")},
 e5:{sc:L("Repeated rejects often trace back to a drawing or specification that is read differently by the two sides.","Penolakan berulang selalunya berpunca daripada lukisan atau spesifikasi yang ditafsir berbeza oleh kedua-dua pihak."),op:L("Two of the last four lots were rejected. Can we go through the reject samples together and compare how we each read the specification?","Dua daripada empat lot terakhir ditolak. Boleh kita semak sampel yang ditolak bersama dan bandingkan cara masing-masing membaca spesifikasi?"),idea:L("Agree a limit sample or photo standard, and ask for their inspection record with each lot.","Setuju satu sampel had atau piawaian bergambar, dan minta rekod pemeriksaan mereka bersama setiap lot.")},
 e6:{sc:L("Their own costs may have risen: raw material, exchange rate, minimum wage, electricity or freight.","Kos mereka sendiri mungkin meningkat: bahan mentah, kadar pertukaran, gaji minimum, elektrik atau pengangkutan."),op:L("We received the notice about the new price. Can you help me understand what is behind the increase?","Kami menerima notis tentang harga baru. Boleh bantu saya faham apa di sebalik kenaikan itu?"),idea:L("Ask for the cost breakdown, then discuss options such as volume commitment, longer contract or a phased increase.","Minta pecahan kos, kemudian bincang pilihan seperti komitmen kuantiti, kontrak lebih panjang atau kenaikan berperingkat.")},
 e7:{sc:L("Late payment is often a process issue: a missing PO number, an invoice sent to the wrong person, or their payment run dates.","Bayaran lewat selalunya isu proses: nombor PO tiada, invois dihantar kepada orang yang salah, atau tarikh kitaran bayaran mereka."),op:L("Three invoices are past due. Can we check whether anything is missing on our invoices that is holding them up?","Tiga invois sudah melepasi tarikh. Boleh kita semak sama ada ada yang kurang pada invois kami yang menyebabkan ia tertahan?"),idea:L("Confirm their payment cycle and the exact documents they need, and send invoices to match it.","Sahkan kitaran bayaran mereka dan dokumen yang diperlukan, dan hantar invois mengikutnya.")},
 e8:{sc:L("Going to your director may be their company's habit for urgent matters, or a sign that they did not get an answer in time.","Pergi kepada pengarah anda mungkin kebiasaan syarikat mereka untuk perkara segera, atau tanda mereka tidak mendapat jawapan tepat pada masa."),op:L("I saw the email to my director. I would like to be the one you can rely on for this. What was not working for you?","Saya nampak emel kepada pengarah saya. Saya nak jadi orang yang boleh diharap untuk perkara ini. Apa yang tidak menjadi bagi pihak tuan?"),idea:L("Agree a response time for normal and urgent matters, and when it is right to copy the director.","Setuju tempoh respons untuk perkara biasa dan segera, dan bila patut menyalin emel kepada pengarah.")},
 s1:{sc:L("Important tasks with no fixed deadline lose to daily firefighting. The longer it waits, the heavier it feels.","Tugasan penting tanpa tarikh akhir yang tetap kalah kepada kerja memadam api setiap hari. Semakin lama ditangguh, semakin berat rasanya."),idea:L("Work on it for 15 minutes first thing tomorrow, before opening email or messages.","Buat selama 15 minit sebagai perkara pertama esok, sebelum membuka emel atau mesej.")},
 s2:{sc:L("Many people here carry two loads at once: work, and family duties such as children, parents and travel.","Ramai orang di sini memikul dua beban serentak: kerja, dan tanggungjawab keluarga seperti anak, ibu bapa dan perjalanan."),idea:L("Write everything down on one page tonight. Circle the three that matter this week and tell one person what you will drop.","Tulis semuanya dalam satu muka malam ini. Bulatkan tiga yang penting minggu ini dan beritahu seorang apa yang anda akan lepaskan.")},
 s3:{sc:L("A sharp reaction usually comes when you are tired, hungry or already carrying something else from the day.","Reaksi yang keras biasanya berlaku bila anda penat, lapar atau sedang memikul perkara lain dari hari itu."),idea:L("Apologise to the person within a day, in one sentence, without explaining why you were upset.","Minta maaf kepada orang itu dalam masa sehari, dengan satu ayat, tanpa menerangkan kenapa anda marah.")},
 s4:{sc:L("After a long stretch of the same work, or after an effort that was not noticed, energy drops even in committed people.","Selepas lama membuat kerja yang sama, atau selepas usaha yang tidak dihargai, tenaga menurun walaupun pada orang yang komited."),idea:L("Pick one small thing you used to enjoy at work and do it this week. Also plan one full day of rest.","Pilih satu perkara kecil yang anda pernah suka di tempat kerja dan buat minggu ini. Rancang juga satu hari rehat penuh.")},
 s5:{sc:L("Saying no feels rude here, especially to a senior or a friend. So the yes comes out before you have checked your own load.","Berkata tidak terasa kurang sopan di sini, terutama kepada orang senior atau kawan. Jadi ya terkeluar sebelum anda menyemak beban sendiri."),idea:L("Use one line: 'Let me check my schedule and get back to you by this afternoon.' Then decide calmly.","Guna satu ayat: 'Biar saya semak jadual dan beritahu sebelum petang ini.' Kemudian putuskan dengan tenang.")},
 s6:{sc:L("The longer a hard conversation is delayed, the bigger it grows in the mind. The talk itself is usually shorter than the worry.","Semakin lama perbualan yang sukar ditangguh, semakin besar ia dalam fikiran. Perbualan itu sendiri biasanya lebih pendek daripada kerisauannya."),idea:L("Write only your first sentence, then message the person today to fix a time.","Tulis ayat pertama anda sahaja, kemudian hantar mesej kepada orang itu hari ini untuk tetapkan masa.")},
 s7:{sc:L("Staying late becomes normal when everyone around does it, or when daytime is taken up by meetings.","Balik lewat menjadi biasa bila semua orang sekeliling melakukannya, atau bila waktu siang dipenuhi mesyuarat."),idea:L("Choose two days this week to leave on time, and tell someone at home so they expect you.","Pilih dua hari minggu ini untuk balik tepat pada masa, dan beritahu orang di rumah supaya mereka menunggu anda.")},
 s8:{sc:L("Feedback often arrives when you are already tired or in front of others, so it feels like an attack even when it is meant to help.","Teguran selalunya datang bila anda sudah penat atau di depan orang lain, jadi ia terasa seperti serangan walaupun niatnya membantu."),idea:L("Next time, say only 'thank you, let me think about it'. Reply properly the next day.","Lain kali, kata sahaja 'terima kasih, biar saya fikirkan'. Beri jawapan yang betul pada hari berikutnya.")},
 sp10:{sc:L("Many couples were raised with different ideas of what is a need and what is a want. Online shopping and easy instalments make the gap show more often.","Ramai pasangan dibesarkan dengan pandangan berbeza tentang apa itu keperluan dan kehendak. Beli-belah dalam talian dan ansuran mudah membuat jurang itu lebih kerap kelihatan."),op:L("I would like us to talk about how we decide on purchases, so neither of us feels judged. Is now a good time?","Saya nak kita bincang cara kita memutuskan sesuatu pembelian, supaya tak ada sesiapa rasa dihakimi. Sekarang sesuai tak?"),idea:L("Agree an amount above which you both discuss first, and a small monthly amount each can spend freely.","Setuju satu jumlah yang perlu dibincang dahulu jika melebihinya, dan sejumlah kecil setiap bulan yang masing-masing bebas belanja.")},
 sp11:{sc:L("After a full work week, one may want to rest at home while the other wants to go out. Both are trying to recover, in different ways.","Selepas seminggu bekerja, seorang mungkin mahu berehat di rumah manakala seorang lagi mahu keluar. Kedua-duanya cuba memulihkan tenaga, dengan cara berbeza."),op:L("For this weekend, can we each say one thing we really want, then plan around both?","Untuk hujung minggu ini, boleh kita masing-masing sebut satu perkara yang betul-betul kita mahu, kemudian rancang ikut kedua-duanya?"),idea:L("Take turns to choose: one weekend each, or one day each. Decide by Thursday so nobody is surprised.","Bergilir memilih: satu hujung minggu seorang, atau satu hari seorang. Putuskan sebelum Khamis supaya tiada yang terkejut.")},
 sp12:{sc:L("The unhappiness is often not about the friends. It is about feeling left behind, or about not knowing the plan in advance.","Rasa tidak senang selalunya bukan tentang kawan itu. Ia tentang rasa ditinggalkan, atau tidak tahu rancangan lebih awal."),op:L("I would like to understand what it feels like for you when I go out with my friends. Can you tell me?","Saya nak faham apa yang awak rasa bila saya keluar dengan kawan-kawan. Boleh ceritakan?"),idea:L("Share the plan early: who, where and what time you will be back. Balance it with time set aside for the two of you.","Kongsi rancangan awal: siapa, di mana dan pukul berapa balik. Imbangi dengan masa yang dikhaskan untuk anda berdua.")},
 sp13:{sc:L("Family and office WhatsApp groups do not stop at 5 pm. Replying has become a habit, and some bosses expect an answer at night.","Kumpulan WhatsApp keluarga dan pejabat tidak berhenti pada pukul 5 petang. Membalas sudah menjadi kebiasaan, dan ada ketua yang menjangka jawapan pada waktu malam."),op:L("I miss talking with you at dinner. Can we find a way that works for both of us with our phones?","Saya rindu berbual dengan awak masa makan malam. Boleh kita cari cara yang sesuai untuk kita berdua tentang telefon?"),idea:L("Agree one phone-free time each day, such as dinner. Urgent calls are the exception.","Setuju satu waktu tanpa telefon setiap hari, seperti waktu makan malam. Panggilan kecemasan dikecualikan.")},
 sp14:{sc:L("A hobby is how some people release work stress. To the one at home, it can look like choosing the hobby over the family.","Hobi ialah cara sesetengah orang melepaskan tekanan kerja. Bagi yang di rumah, ia boleh nampak seperti memilih hobi berbanding keluarga."),op:L("I know the hobby matters, and family time matters too. Can we look at the month together and plan both?","Saya tahu hobi itu penting, dan masa keluarga pun penting. Boleh kita tengok jadual bulan ini bersama dan rancang kedua-duanya?"),idea:L("Mark hobby days and family days on a shared calendar. Now and then, invite the family along.","Tandakan hari hobi dan hari keluarga dalam kalendar bersama. Sekali-sekala, ajak keluarga ikut serta.")},
 sp15:{sc:L("Both of you arrive tired from the week and the journey, and expect the weekend to make up for five days. Small things then turn into arguments.","Kedua-duanya tiba dalam keadaan penat selepas seminggu dan perjalanan, dan mengharapkan hujung minggu menggantikan lima hari. Perkara kecil kemudian menjadi pertengkaran."),op:L("Our weekends are short and I do not want us to spend them arguing. Can we talk about how to make them easier for both of us?","Hujung minggu kita singkat dan saya tak mahu kita habiskan dengan bertengkar. Boleh kita bincang cara untuk memudahkannya bagi kita berdua?"),idea:L("Keep the first two hours after arriving free of chores and heavy topics. Plan who travels on which weekend a month ahead.","Biarkan dua jam pertama selepas tiba tanpa kerja rumah dan topik berat. Rancang siapa yang berulang-alik pada hujung minggu mana sebulan lebih awal.")},
 sp16:{sc:L("Shift rotation and OT are often not a choice. Declining OT can affect income, and sometimes how the supervisor sees you.","Giliran syif dan OT selalunya bukan pilihan. Menolak OT boleh menjejaskan pendapatan, dan kadangkala pandangan penyelia."),op:L("I know the shift and OT are not fully in our hands. Can we look at this month's roster and find our time together?","Saya tahu syif dan OT bukan sepenuhnya dalam kawalan kita. Boleh kita tengok jadual bulan ini dan cari masa untuk kita bersama?"),idea:L("Put the roster where both can see it and block one fixed time each week, even a breakfast after night shift.","Letak jadual syif di tempat yang kedua-dua boleh nampak dan tetapkan satu masa setiap minggu, walaupun sarapan selepas syif malam.")},
 sp17:{sc:L("Both families wait all year for the first day of Raya. For each of you, going home is also about your parents' feelings.","Kedua-dua keluarga menunggu setahun untuk hari raya pertama. Bagi masing-masing, balik kampung juga tentang perasaan ibu bapa."),op:L("Can we plan Raya early this year, so both sides get a fair turn and our parents know in advance?","Boleh kita rancang Raya awal tahun ini, supaya kedua-dua belah dapat giliran yang adil dan ibu bapa tahu lebih awal?"),idea:L("Alternate the first day by year, and tell both families the plan together, well before Ramadan ends.","Gilirkan hari pertama mengikut tahun, dan beritahu kedua-dua keluarga bersama, jauh sebelum Ramadan berakhir.")},
 sp18:{sc:L("A transfer affects two careers, the children's school and who looks after the parents. In government service, declining may also affect promotion.","Pertukaran memberi kesan kepada dua kerjaya, sekolah anak dan siapa yang menjaga ibu bapa. Dalam perkhidmatan kerajaan, menolak juga boleh menjejaskan kenaikan pangkat."),op:L("This offer affects both of us. Before we decide, can we each say what worries us most?","Tawaran ini memberi kesan kepada kita berdua. Sebelum memutuskan, boleh kita masing-masing sebut apa yang paling merisaukan?"),idea:L("List the options side by side: move together, live apart for a period, or decline. Write what each means for work, children and parents.","Senaraikan pilihan sebelah-menyebelah: pindah bersama, berjauhan untuk satu tempoh, atau menolak. Tulis kesan setiap satu kepada kerja, anak dan ibu bapa.")},
 sp19:{sc:L("Going quiet is a common way to show hurt without starting a fight. It usually means something was felt, not that you are being punished.","Mendiamkan diri ialah cara biasa menunjukkan terasa hati tanpa memulakan pergaduhan. Ia biasanya bermakna ada sesuatu yang dirasai, bukan anda sedang dihukum."),op:L("I can see something is not right between us, and I may have missed it. I want to listen. Will you tell me?","Saya nampak ada yang tak kena antara kita, dan mungkin saya terlepas pandang. Saya nak dengar. Boleh ceritakan?"),idea:L("Choose a calm moment, sit down, and let them finish before you explain anything.","Pilih masa yang tenang, duduk bersama, dan biar mereka habis bercakap sebelum anda menerangkan apa-apa.")},
 c1:{sc:L("Children often tune out when instructions come many times a day or in an angry voice. They wait for the tone that means it is serious.","Anak selalunya tidak mengendahkan arahan yang datang berkali-kali sehari atau dengan suara marah. Mereka menunggu nada yang bermakna betul-betul serius."),op:L("I want to talk about tidying your room, without getting angry. Can you tell me what makes it hard to start?","Boleh kita sembang tentang mengemas bilik, tanpa marah-marah? Cuba beritahu, apa yang buat susah nak mula?"),idea:L("Give one instruction at a time, agree when it should be done, and ask them to repeat it back.","Beri satu arahan pada satu masa, setuju bila ia perlu siap, dan minta mereka ulang semula.")},
 c2:{sc:L("For this generation, friends, games and even school groups all live on the phone. Taking it away can feel like being cut off from friends.","Bagi generasi ini, kawan, permainan dan kumpulan sekolah semuanya ada dalam telefon. Mengambilnya boleh terasa seperti diputuskan daripada kawan."),op:L("I am not here to take your phone. I want us to agree on times that are fair. What do you think is reasonable?","Bukan nak ambil telefon kamu. Kita cari masa yang adil sama-sama. Pada kamu, berapa lama yang munasabah?"),idea:L("Agree phone-free times for everyone at home, parents included, such as meals and after 10 pm.","Setuju waktu tanpa telefon untuk semua orang di rumah, termasuk ibu bapa, seperti waktu makan dan selepas 10 malam.")},
 c3:{sc:L("Results can drop because of a subject that got harder, a change of teacher, friends, tiredness or something they are worried about.","Keputusan boleh merosot kerana subjek yang semakin susah, pertukaran guru, kawan, kepenatan atau sesuatu yang merisaukan mereka."),op:L("I saw the results and I am not angry. I want to understand. Which subject or part feels hardest now?","Keputusan itu sudah dilihat, dan bukan nak marah. Cuma nak faham. Subjek atau bahagian mana yang paling susah sekarang?"),idea:L("Talk to the class teacher together, and fix a short daily study time before discussing tuition.","Berjumpa guru kelas bersama, dan tetapkan waktu belajar harian yang pendek sebelum berbincang tentang tuisyen.")},
 c4:{sc:L("Teenagers test limits as they grow. A raised voice is often frustration at not being heard, coming out the wrong way.","Remaja menguji batas semasa membesar. Suara yang meninggi selalunya kekecewaan kerana tidak didengari, yang terkeluar dengan cara yang salah."),op:L("Earlier we both raised our voices. I want to hear what you were trying to say. Can we try again calmly?","Tadi kita sama-sama meninggikan suara. Cuba ceritakan apa yang kamu nak sampaikan. Boleh kita cuba semula dengan tenang?"),idea:L("Agree a family rule: anyone can ask for a 10-minute break when voices rise, then come back to finish the talk.","Setuju satu peraturan keluarga: sesiapa boleh minta rehat 10 minit bila suara meninggi, kemudian sambung semula perbincangan.")},
 c5:{sc:L("Many parents picture a stable path such as engineering, medicine or government service. This generation sees careers that did not exist before.","Ramai ibu bapa membayangkan laluan yang stabil seperti kejuruteraan, perubatan atau perkhidmatan kerajaan. Generasi ini nampak kerjaya yang tidak wujud dahulu."),op:L("I want to understand what draws you to this course. Tell me about it, and I will listen before I say anything.","Cuba ceritakan apa yang menarik tentang kursus ini. Dengar dulu, komen kemudian."),idea:L("Ask them to find out the job prospects and costs, and visit the campus or meet someone in that field together.","Minta mereka cari maklumat peluang kerja dan kos, dan lawat kampus atau jumpa orang dalam bidang itu bersama.")},
 c6:{sc:L("Starting pay is low, rent and a car loan are high, and jobs are often contract-based. Changing jobs is a normal way to raise pay for this generation.","Gaji permulaan rendah, sewa dan pinjaman kereta tinggi, dan kerja selalunya kontrak. Bertukar kerja ialah cara biasa generasi ini menaikkan gaji."),op:L("I would like to understand your plan for the next two years, and how we can support you without carrying everything.","Cuba kongsi rancangan kamu untuk dua tahun akan datang, dan macam mana kami boleh sokong tanpa menanggung semuanya."),idea:L("Agree a small fixed contribution to the household, and a date to review it together.","Setuju satu sumbangan kecil yang tetap untuk rumah, dan satu tarikh untuk menyemaknya bersama.")},
 c7:{sc:L("Students are busy with classes, assignments and friends. A short reply usually means they are busy, not that they have forgotten home.","Pelajar sibuk dengan kelas, tugasan dan kawan. Balasan pendek biasanya bermakna mereka sibuk, bukan lupa pada keluarga."),op:L("We miss hearing from you. What is a good time in the week for us to call, so we do not disturb your classes?","Kami rindu nak dengar khabar. Bila masa yang sesuai dalam seminggu untuk kami telefon, supaya tak ganggu kelas?"),idea:L("Agree a fixed 20-minute call each week, and send short messages that do not always need a reply.","Setuju satu panggilan tetap 20 minit setiap minggu, dan hantar mesej pendek yang tidak semestinya perlu dibalas.")},
 c8:{sc:L("To a young person, coming home late is about friends and freedom. To a parent, it is about accidents on the road.","Bagi orang muda, balik lewat ialah tentang kawan dan kebebasan. Bagi ibu bapa, ia tentang kemalangan di jalan raya."),op:L("I am not trying to control you. I worry when I do not know where you are. Can we agree on something that works for both of us?","Bukan nak mengawal. Cuma risau bila tak tahu kamu di mana. Boleh kita setuju sesuatu yang sesuai untuk kedua-dua pihak?"),idea:L("Agree a time to be home and one message if plans change. Keep your side: no long questioning at the door.","Setuju waktu balik dan satu mesej jika rancangan berubah. Tunaikan bahagian anda: tiada soal siasat panjang di muka pintu.")},
 c9:{sc:L("Parents think about readiness, cost and the other family. The child is thinking about commitment and doing things the right way.","Ibu bapa memikirkan kesediaan, kos dan keluarga sebelah sana. Anak pula memikirkan komitmen dan mahu melakukannya dengan cara yang betul."),op:L("I would like to know more about your plans and about the person. Tell me, and I will listen first.","Cuba ceritakan lebih lanjut tentang rancangan kamu dan tentang orangnya. Dengar dulu, baru beri pandangan."),idea:L("Meet the person and the family before forming a view, and talk about a realistic budget and timeline together.","Jumpa orangnya dan keluarganya sebelum membuat penilaian, dan bincang bajet serta tempoh masa yang realistik bersama.")},
 c10:{sc:L("Reminders given with anger or shame tend to push a young person away. What they see at home often teaches more than what they are told.","Teguran dengan marah atau memalukan cenderung menjauhkan orang muda. Apa yang mereka lihat di rumah selalunya lebih mengajar daripada apa yang disuruh."),op:L("I am not angry. I care about you, and I want to understand how you are doing these days.","Bukan nak marah. Sebab sayang, nak tahu keadaan kamu kebelakangan ini macam mana."),idea:L("Invite, do not order: pray together at home, or go to the surau together, and keep the tone gentle.","Ajak, bukan arah: solat berjemaah di rumah, atau pergi ke surau bersama, dan kekalkan nada yang lembut.")},
 pa1:{sc:L("For many parents of that generation, comparing is a way to motivate, or to share news about the family. They may not know it hurts.","Bagi ramai ibu bapa generasi itu, membanding ialah cara memberi semangat, atau berkongsi cerita keluarga. Mereka mungkin tidak tahu ia melukakan."),op:L("I am happy for them too. I would also like to share what I have been doing lately. Can I tell you about it?","Saya pun tumpang gembira. Saya juga nak kongsi apa yang saya buat kebelakangan ini. Boleh saya ceritakan?"),idea:L("Share your own news regularly, in small pieces. Parents can only talk about what they know.","Kongsi berita anda sendiri selalu, sedikit demi sedikit. Ibu bapa hanya boleh bercerita tentang apa yang mereka tahu.")},
 pa2:{sc:L("Giving advice is how many parents show they still care and are still needed. Stopping feels to them like no longer being a parent.","Memberi nasihat ialah cara ramai ibu bapa menunjukkan mereka masih sayang dan masih diperlukan. Berhenti menasihat terasa seperti bukan lagi ibu bapa."),op:L("I appreciate the advice, and I know it comes from care. On this matter, I would like to try it our way first. Is that okay?","Saya hargai nasihat itu, dan saya tahu ia kerana sayang. Untuk hal ini, kami nak cuba cara kami dahulu. Boleh ya?"),idea:L("Ask for their advice on other things, so they still feel involved, and thank them even when you decide differently.","Minta nasihat mereka dalam perkara lain, supaya mereka masih rasa dilibatkan, dan ucap terima kasih walaupun anda memutuskan sebaliknya.")},
 pa3:{sc:L("Accepting help can feel like admitting weakness or becoming a burden. Many elders say 'I am fine' to protect their children.","Menerima bantuan boleh terasa seperti mengaku lemah atau menjadi beban. Ramai orang tua kata 'tak apa' untuk tidak menyusahkan anak."),op:L("I worry when the appointment is missed. Was there anything that made it difficult to go?","Saya risau bila temu janji terlepas. Ada apa-apa yang menyukarkan untuk pergi?"),idea:L("Offer a specific small help instead of a general one, such as driving them on that day, and let them choose the time.","Tawarkan bantuan kecil yang khusus, bukan umum, seperti menghantar pada hari itu, dan biar mereka pilih masanya.")},
 pa4:{sc:L("For parents, a visit is how they measure closeness. Your busy weeks are invisible to them; they only see the empty weekend.","Bagi ibu bapa, kepulangan anak ialah ukuran kemesraan. Kesibukan anda tidak kelihatan bagi mereka; mereka hanya nampak hujung minggu yang kosong."),op:L("I am sorry it has been so long. I miss home too. Can we plan my next visit now?","Minta maaf sebab lama tak balik. Saya pun rindu. Boleh kita rancang kepulangan seterusnya sekarang?"),idea:L("Fix the next visit date before you leave each time, and add a short call on a set day each week.","Tetapkan tarikh balik seterusnya setiap kali sebelum pulang, dan tambah panggilan pendek pada hari tetap setiap minggu.")},
 pa5:{sc:L("The kampung house holds their friends, the surau, the garden and their independence. Moving in can feel like giving up their own life.","Rumah kampung ada kawan, surau, kebun dan kebebasan mereka. Berpindah boleh terasa seperti melepaskan kehidupan sendiri."),op:L("I understand the kampung is home. I only worry about you being alone. What would make you feel safe there?","Saya faham kampung itulah rumah. Saya cuma risau tinggal seorang diri. Apa yang boleh buat rasa lebih selamat di sana?"),idea:L("Try short stays first, and arrange for a neighbour or relative to check in daily. Siblings can take turns to visit.","Cuba tinggal sekejap-sekejap dahulu, dan minta jiran atau saudara menjenguk setiap hari. Adik-beradik boleh bergilir balik.")},
 pa6:{sc:L("Elders trust what comes from people they know, and scam callers sound official. Being corrected by a child can feel embarrassing.","Orang tua percaya apa yang datang daripada orang yang mereka kenal, dan pemanggil scam kedengaran rasmi. Ditegur oleh anak boleh terasa memalukan."),op:L("These scam calls are very convincing, and many people nearly fall for them. Can I show you how I check before I believe one?","Panggilan scam sekarang memang meyakinkan, ramai yang hampir terkena. Boleh saya tunjuk cara saya semak sebelum percaya?"),idea:L("Agree one rule: call a family member first before any transfer. Save the anti-scam hotline 997 in their phone.","Setuju satu peraturan: telefon ahli keluarga dahulu sebelum sebarang pemindahan wang. Simpan talian anti-scam 997 dalam telefon mereka.")},
 pa7:{sc:L("Parents often give more to the child who lives nearest, visits most, or seems to need it most. They may not see it as favouring.","Ibu bapa selalunya memberi lebih kepada anak yang tinggal paling dekat, paling kerap balik, atau nampak paling memerlukan. Mereka mungkin tidak anggap itu pilih kasih."),op:L("I noticed something and I may be wrong. I felt my children were a little left out. Can I share how it looked to me?","Saya ada perasan sesuatu, dan mungkin saya silap. Saya rasa anak-anak saya sedikit terpinggir. Boleh saya kongsi apa yang saya nampak?"),idea:L("Bring your children to visit more often, so the grandparents know them as well as the others.","Bawa anak-anak balik lebih kerap, supaya datuk dan nenek mengenali mereka sama seperti cucu lain.")},
 pa8:{sc:L("Parents compare with how they raised you and with their own customs. A comment is often meant as help, said without thinking of who is listening.","Ibu bapa membanding dengan cara mereka membesarkan anda dan adat mereka sendiri. Teguran selalunya berniat membantu, diucap tanpa memikirkan siapa yang mendengar."),op:L("I know the comment came from care. It was hard for my spouse to hear it in front of everyone. Could advice like that come to me first?","Saya tahu teguran itu kerana sayang. Cuma pasangan saya terasa bila ditegur di depan semua orang. Boleh nasihat begitu disampaikan kepada saya dahulu?"),idea:L("Speak to your own parent yourself; do not leave your spouse to do it. Mention one thing your spouse does well.","Anda sendiri yang berbincang dengan ibu bapa anda; jangan biarkan pasangan yang melakukannya. Sebut satu perkara baik yang pasangan anda lakukan.")},
 pa9:{sc:L("Driving is their independence: the surau, the market, visiting friends. Losing it means depending on others for everything.","Memandu ialah kebebasan mereka: ke surau, ke pasar, menziarahi kawan. Kehilangannya bermakna bergantung kepada orang lain untuk semua perkara."),op:L("I know driving means freedom. After the two accidents, I worry. Can we talk about how to keep you safe and still able to go out?","Saya tahu memandu itu kebebasan. Selepas dua kemalangan itu, saya risau. Boleh kita bincang cara untuk kekal selamat dan masih boleh keluar?"),idea:L("Start small: no night or long-distance driving. Arrange rides for the surau and market, and suggest an eye check-up.","Mula dengan kecil: tidak memandu waktu malam atau jarak jauh. Aturkan kenderaan ke surau dan pasar, dan cadangkan pemeriksaan mata.")},
 sb1:{sc:L("The sibling who lives nearest or is unmarried often ends up doing most of the caring. The others may not realise how much it is.","Adik-beradik yang tinggal paling dekat atau belum berkahwin selalunya menanggung paling banyak penjagaan. Yang lain mungkin tidak sedar betapa banyaknya."),op:L("I have been taking our parent to most appointments, and I am getting tired. Can we talk about sharing it?","Saya yang membawa ibu bapa ke kebanyakan temu janji, dan saya semakin penat. Boleh kita bincang cara berkongsi?"),idea:L("List the tasks: clinic visits, medicine, bills, weekend visits. Let each sibling pick, including those who can only help with money.","Senaraikan tugas: lawatan klinik, ubat, bil, balik hujung minggu. Biar setiap adik-beradik memilih, termasuk yang hanya mampu membantu dengan wang.")},
 sb2:{sc:L("Each sibling has a different income and different commitments. An equal split can feel unfair to one, and a different split unfair to another.","Setiap adik-beradik berbeza pendapatan dan komitmen. Pembahagian sama rata boleh terasa tidak adil bagi seorang, dan pembahagian berbeza tidak adil bagi yang lain."),op:L("I would like us to settle the cost in a way everyone feels is fair. Can each of us say what we are able to give?","Saya nak kita selesaikan kos ini dengan cara yang semua rasa adil. Boleh masing-masing nyatakan berapa yang mampu?"),idea:L("Write the agreement in the family group so it is clear. For property, get proper advice from the land office or a lawyer.","Tulis persetujuan dalam kumpulan keluarga supaya jelas. Untuk harta, dapatkan nasihat yang betul daripada pejabat tanah atau peguam.")},
 sb3:{sc:L("Between siblings, a loan often has no date or terms. The borrower may feel family should understand; the lender feels awkward asking.","Antara adik-beradik, pinjaman selalunya tiada tarikh atau syarat. Peminjam mungkin rasa keluarga patut faham; pemberi pinjam pula segan untuk meminta."),op:L("It is not easy for me to bring this up. About the money from January, can we talk about a way to settle it that you can manage?","Bukan mudah untuk saya bangkitkan perkara ini. Tentang wang dari bulan Januari, boleh kita bincang cara menyelesaikannya yang mampu dibuat?"),idea:L("Offer small monthly amounts instead of one payment, and agree the date each month.","Tawarkan bayaran kecil setiap bulan, bukan sekali gus, dan setuju tarikhnya setiap bulan.")},
 sb4:{sc:L("After a long silence, both sides usually wait for the other to start. Pride and not knowing what to say keep it going.","Selepas lama berdiam, kedua-dua pihak biasanya menunggu pihak satu lagi memulakan. Ego dan tidak tahu apa hendak dikata membuat ia berpanjangan."),op:L("It has been a long time, and I miss having you as my sibling. I do not want to argue about the past. Can we start by having a meal?","Sudah lama, dan saya rindu hubungan kita adik-beradik. Saya tak nak bertengkar tentang hal lama. Boleh kita mula dengan makan bersama?"),idea:L("Start with a short message at Raya or a birthday. Do not bring up the old issue in the first meeting.","Mula dengan mesej pendek semasa Raya atau hari lahir. Jangan bangkitkan isu lama pada perjumpaan pertama.")},
 sb5:{sc:L("The one with the biggest house or who lives nearest the parents becomes the default host. Over the years, it stops being noticed as a contribution.","Yang rumahnya paling besar atau paling dekat dengan ibu bapa menjadi tuan rumah secara automatik. Lama-kelamaan, ia tidak lagi dilihat sebagai sumbangan."),op:L("We are happy to host, but it has been three years in a row. Can we talk about taking turns or sharing the cost?","Kami gembira menjadi tuan rumah, tapi sudah tiga tahun berturut-turut. Boleh kita bincang tentang bergilir atau berkongsi kos?"),idea:L("Rotate the host by year. Those who do not host bring the food or share the cost.","Gilirkan tuan rumah mengikut tahun. Yang tidak menjadi tuan rumah membawa makanan atau berkongsi kos.")},
 sb6:{sc:L("Family land is often used without paperwork, on a parent's word given years ago. Each sibling remembers that word differently.","Tanah keluarga selalunya digunakan tanpa dokumen, atas kata-kata ibu bapa bertahun dahulu. Setiap adik-beradik mengingati kata-kata itu secara berbeza."),op:L("I would like all of us to have the same understanding about the land, so it does not become a problem later. Can we discuss it together?","Saya nak kita semua ada kefahaman yang sama tentang tanah itu, supaya tak jadi masalah kemudian. Boleh kita bincang bersama?"),idea:L("Hold one family meeting with everyone present, write down what is agreed, and get proper advice on inheritance and title.","Adakan satu mesyuarat keluarga dengan semua hadir, tulis apa yang dipersetujui, dan dapatkan nasihat yang betul tentang pusaka dan hak milik.")},
 sb7:{sc:L("An in-law comes from a different family culture and may feel like an outsider. Small misunderstandings grow when nobody clears them.","Ipar datang daripada budaya keluarga yang berbeza dan mungkin rasa seperti orang luar. Salah faham kecil membesar bila tiada siapa menjernihkannya."),op:L("I felt things were a bit awkward between us at the last gathering. If I said something wrong, I would like to clear it.","Saya rasa keadaan agak janggal antara kita pada perhimpunan lepas. Kalau saya tersalah cakap, saya nak jernihkan."),idea:L("Talk to the in-law directly and kindly, not through your sibling. Find one shared activity at the next gathering.","Berbincang terus dengan ipar secara baik, bukan melalui adik-beradik. Cari satu aktiviti bersama pada perhimpunan seterusnya.")},
 sb8:{sc:L("Text has no tone. A short reply or a forwarded message is easily read as an attack, and everyone in the group is watching.","Teks tiada nada. Balasan pendek atau mesej yang dimajukan mudah dibaca sebagai serangan, dan semua orang dalam kumpulan memerhati."),op:L("I think our messages in the group came out harsher than we meant. Can we talk by phone instead?","Saya rasa mesej kita dalam kumpulan kedengaran lebih keras daripada yang dimaksudkan. Boleh kita berbual melalui telefon?"),idea:L("Move any disagreement out of the group to a call. Keep the group for news, photos and plans.","Alihkan sebarang perselisihan keluar dari kumpulan kepada panggilan telefon. Kekalkan kumpulan untuk berita, gambar dan rancangan.")},
 sb9:{sc:L("A sibling in difficulty turns to family first because the bank has said no. Refusing feels like abandoning them, and agreeing puts your own family at risk.","Adik-beradik yang kesempitan mencari keluarga dahulu kerana bank sudah menolak. Menolak terasa seperti meninggalkan mereka, dan bersetuju meletakkan keluarga sendiri dalam risiko."),op:L("I want to help, but I cannot be a guarantor because of my own commitments. Can we look at other ways I can help?","Saya nak bantu, tapi saya tak boleh jadi penjamin kerana komitmen saya sendiri. Boleh kita tengok cara lain yang saya boleh bantu?"),idea:L("Decide your limit before the talk. Offer what you can afford to lose, or help in kind, and suggest AKPK for debt advice.","Tentukan had anda sebelum berbincang. Tawarkan apa yang anda mampu lepaskan, atau bantuan bukan wang, dan cadangkan AKPK untuk nasihat hutang.")},
 rl1:{sc:L("For many older relatives, asking about salary, weight or marriage is ordinary small talk and a way to show interest.","Bagi ramai saudara yang lebih tua, bertanya tentang gaji, berat badan atau jodoh ialah perbualan biasa dan cara menunjukkan ambil berat."),op:L("Alhamdulillah, things are fine. How about you, how is your health these days?","Alhamdulillah, semua baik. Mak cik pula macam mana, sihat?"),idea:L("Prepare one light answer and one question to turn the topic. Answer with a smile and move on.","Sediakan satu jawapan ringan dan satu soalan untuk mengalih topik. Jawab dengan senyuman dan teruskan.")},
 rl2:{sc:L("In-laws often help the way they ran their own home. They may not see it as interfering, especially when they are looking after the grandchildren.","Mertua selalunya membantu mengikut cara mereka menguruskan rumah sendiri. Mereka mungkin tidak anggap itu campur tangan, terutama bila menjaga cucu."),op:L("We are grateful for the help with the children. There are one or two routines we would like to keep the same. Can we share them?","Kami bersyukur dengan bantuan menjaga anak-anak. Ada satu dua rutin yang kami nak kekalkan. Boleh kami kongsikan?"),idea:L("Let the spouse whose parents they are do the talking. Choose two routines that matter and let the small things go.","Biar pasangan yang merupakan anak mereka yang berbincang. Pilih dua rutin yang penting dan lepaskan perkara kecil.")},
 rl3:{sc:L("Family news travels fast, and each person adds a little. The version that reaches you may be far from what was first said.","Cerita keluarga cepat tersebar, dan setiap orang menambah sedikit. Versi yang sampai kepada anda mungkin jauh daripada apa yang mula-mula dikata."),op:L("I heard something was said about us, and I would rather ask you directly than believe it. Can you tell me what happened?","Saya dengar ada sesuatu yang diperkatakan tentang kami, dan saya lebih suka tanya terus daripada percaya begitu sahaja. Boleh ceritakan apa yang berlaku?"),idea:L("Share less with those who pass things on, and correct the story once, calmly, with the person who started it.","Kurangkan berkongsi dengan orang yang suka menyampaikan, dan betulkan cerita sekali, dengan tenang, kepada orang yang memulakannya.")},
 rl4:{sc:L("The family that is seen as more comfortable or lives in town is often expected to give more. Nobody asks whether it is easy for them.","Keluarga yang dilihat lebih senang atau tinggal di bandar selalunya dijangka memberi lebih. Tiada siapa bertanya sama ada mudah bagi mereka."),op:L("We are glad to contribute. This year we have a few commitments, so this is what we are able to give.","Kami gembira dapat menyumbang. Tahun ini kami ada beberapa komitmen, jadi ini yang kami mampu berikan."),idea:L("Decide with your spouse what you can give for the year, and say the amount early and kindly.","Putuskan dengan pasangan berapa yang mampu diberi untuk setahun, dan nyatakan jumlahnya awal dengan baik.")},
 rl5:{sc:L("Each side counts the days, and each set of parents waits. The spouse whose family gets less time often feels it most.","Setiap belah mengira hari, dan setiap ibu bapa menunggu. Pasangan yang keluarganya mendapat masa lebih sedikit paling terasa."),op:L("We want to spend Raya fairly with both families. This is our plan for this year. We hope it is okay.","Kami nak beraya secara adil dengan kedua-dua keluarga. Ini rancangan kami untuk tahun ini. Harap tidak mengapa."),idea:L("Agree the split with your spouse first, then tell both families the same plan early, and alternate next year.","Setuju pembahagian dengan pasangan dahulu, kemudian beritahu kedua-dua keluarga rancangan yang sama lebih awal, dan gilirkan tahun depan.")},
 rl6:{sc:L("Results and university offers are a favourite topic at gatherings. For the proud parent it is sharing good news, not an attack on your child.","Keputusan peperiksaan dan tawaran universiti ialah topik kegemaran di perhimpunan keluarga. Bagi ibu bapa yang bangga, itu berkongsi berita baik, bukan menyerang anak anda."),op:L("Congratulations to them, that is good news. Each child has their own path, and ours is doing well in their own way.","Tahniah, berita baik tu. Setiap anak ada jalan masing-masing, dan anak kami pun baik dengan caranya sendiri."),idea:L("Talk to your child afterwards so they know you are proud of them, whatever was said.","Berbual dengan anak anda selepas itu supaya mereka tahu anda bangga dengan mereka, walau apa pun yang dikatakan.")},
 rl7:{sc:L("To the older generation, these questions are a way of showing they care and of making conversation. They rarely know how tiring they are to hear.","Bagi generasi lama, soalan begini ialah cara menunjukkan ambil berat dan memulakan perbualan. Mereka jarang tahu betapa penat mendengarnya."),op:L("Doakan saja. When there is good news, you will be among the first to know.","Doakan sajalah. Kalau ada berita baik, mak cik antara yang pertama tahu."),idea:L("Keep one light reply ready and use it every time. A smile and a change of topic works better than explaining.","Sediakan satu jawapan ringan dan guna setiap kali. Senyuman dan menukar topik lebih berkesan daripada menerangkan.")},
 rl8:{sc:L("Relatives assume that someone inside the company can decide. They may not know that hiring goes through HR and that your name is at stake.","Saudara-mara menganggap orang dalam syarikat boleh memutuskan. Mereka mungkin tidak tahu pengambilan pekerja melalui HR dan nama anda turut dipertaruhkan."),op:L("I would be glad to help. Hiring is decided by HR, not by me. I can share the vacancy and how to apply.","Saya gembira dapat membantu. Pengambilan pekerja diputuskan oleh HR, bukan saya. Saya boleh kongsi kekosongan dan cara memohon."),idea:L("Send the official job link and offer to review the resume. Be clear that you cannot influence the result.","Hantar pautan kerja rasmi dan tawarkan untuk menyemak resume. Jelaskan bahawa anda tidak boleh mempengaruhi keputusan.")},
 n1:{sc:L("In terrace houses, sound carries through shared walls. The neighbour may work shifts, or may not know how loud it is on your side.","Di rumah teres, bunyi merebak melalui dinding yang dikongsi. Jiran mungkin bekerja syif, atau tidak tahu betapa kuatnya di sebelah anda."),op:L("Sorry to trouble you. The sound comes through to our room at night, and we have small children sleeping. Could it be lowered after 11 pm?","Maaf mengganggu. Bunyi itu sampai ke bilik kami pada waktu malam, dan anak kecil kami sedang tidur. Boleh diperlahankan selepas pukul 11 malam?"),idea:L("Go over in person at a calm time, not while it is happening. Bring a small gift if this is your first proper conversation.","Pergi berjumpa pada waktu yang tenang, bukan ketika ia sedang berlaku. Bawa buah tangan jika ini perbualan pertama anda.")},
 n2:{sc:L("Many households have more cars than the porch can hold, and visitors park wherever there is space.","Banyak rumah ada lebih kereta daripada ruang anjung, dan tetamu meletak kenderaan di mana sahaja ada ruang."),op:L("Sorry to bother you. My gate was blocked twice this week and I could not get out for work. Could we work something out?","Maaf mengganggu. Pagar saya terhalang dua kali minggu ini dan saya tak dapat keluar ke tempat kerja. Boleh kita cari jalan?"),idea:L("Exchange phone numbers so either of you can call when a car needs moving.","Bertukar nombor telefon supaya masing-masing boleh menghubungi bila kereta perlu dialihkan.")},
 n3:{sc:L("They may not know where their cat goes or how far their tree's leaves fall. From their side of the fence, nothing looks wrong.","Mereka mungkin tidak tahu ke mana kucing mereka pergi atau sejauh mana daun pokok mereka gugur. Dari sebelah pagar mereka, tiada apa yang nampak salah."),op:L("I wanted to let you know, in a friendly way, that some of the leaves and rubbish end up at my gate. Can we find a solution together?","Saya nak maklumkan secara baik, sebahagian daun dan sampah sampai ke pagar saya. Boleh kita cari penyelesaian bersama?"),idea:L("Suggest something specific, such as trimming the branch or covering the bin, and offer to help with it.","Cadangkan sesuatu yang khusus, seperti memangkas dahan atau menutup tong, dan tawarkan untuk membantu.")},
 n4:{sc:L("Some people are shy, busy or new to the area. Many taman residents leave before dawn and return after dark.","Sesetengah orang pemalu, sibuk atau baru di kawasan itu. Ramai penduduk taman keluar sebelum subuh dan pulang selepas gelap."),op:L("Assalamualaikum. I live next door, and I do not think we have properly met. I am [name].","Assalamualaikum. Saya tinggal di sebelah, rasanya kita belum berkenalan betul-betul. Saya [nama]."),idea:L("Keep greeting without expecting a reply. Share food at Raya or after a kenduri; it opens doors.","Teruskan memberi salam tanpa mengharap balasan. Hantar juadah semasa Raya atau selepas kenduri; ia membuka ruang.")},
 n5:{sc:L("Contractors set the hours, and the owner is usually at work and does not hear the noise or see the dust.","Kontraktor yang menentukan waktu kerja, dan pemilik biasanya di tempat kerja dan tidak mendengar bunyi atau nampak habuk."),op:L("I understand the renovation needs to be done. The drilling starts early on Sundays. Could the noisy work start a bit later that day?","Saya faham kerja ubah suai perlu dibuat. Kerja menggerudi bermula awal pada hari Ahad. Boleh kerja yang bising dimulakan lewat sedikit pada hari itu?"),idea:L("Ask for the work schedule, so you know when the loud days are. Many councils also limit renovation hours.","Minta jadual kerja, supaya anda tahu bila hari yang bising. Kebanyakan majlis perbandaran juga mengehadkan waktu kerja ubah suai.")},
 n6:{sc:L("Closing the lane for a kenduri is a long-standing custom in many taman. The host is busy and may assume everyone knows.","Menutup lorong untuk kenduri ialah kebiasaan lama di banyak taman. Tuan rumah sibuk dan mungkin anggap semua orang tahu."),op:L("Congratulations on the kenduri. For next time, could we be told a few days ahead, so we can park outside?","Tahniah atas majlis itu. Untuk lain kali, boleh kami dimaklumkan beberapa hari awal, supaya kami boleh letak kereta di luar?"),idea:L("Suggest that the taman group posts a notice a week before any road closure, with the hours.","Cadangkan supaya kumpulan taman menghantar makluman seminggu sebelum sebarang penutupan jalan, bersama waktunya.")},
 n7:{sc:L("A complaint in the group reaches fifty houses at once. It is often posted in a moment of annoyance, without thinking how it lands.","Aduan dalam kumpulan sampai kepada lima puluh rumah serentak. Ia selalunya dihantar ketika geram, tanpa memikirkan kesannya."),op:L("I saw the message in the group. I would like to settle it with you directly. Can I come over and talk?","Saya nampak mesej dalam kumpulan. Saya nak selesaikan terus dengan awak. Boleh saya datang berbincang?"),idea:L("Do not reply in the group. Settle it face to face, then post one short line that it has been resolved.","Jangan balas dalam kumpulan. Selesaikan secara bersemuka, kemudian hantar satu baris pendek bahawa ia sudah selesai.")},
 n8:{sc:L("Some households are in real difficulty. Others doubt how the money is used, or feel the service does not benefit them.","Sesetengah rumah memang dalam kesempitan. Yang lain meragui cara wang digunakan, atau rasa perkhidmatan itu tidak memberi manfaat kepada mereka."),op:L("The committee is checking on the security fee. Is there a concern about the fee or the service that we should know about?","Jawatankuasa sedang menyemak yuran keselamatan. Ada apa-apa kebimbangan tentang yuran atau perkhidmatan yang kami patut tahu?"),idea:L("Share a simple monthly account in the group, and let the committee offer instalments privately to those in difficulty.","Kongsi akaun bulanan yang ringkas dalam kumpulan, dan biar jawatankuasa menawarkan ansuran secara tertutup kepada yang kesempitan.")},
 n9:{sc:L("Feeding strays is an act of kindness for many people. They may not see where the cats go afterwards.","Memberi makan kucing jalanan ialah amalan baik bagi ramai orang. Mereka mungkin tidak nampak ke mana kucing itu pergi selepas itu."),op:L("It is kind of you to feed the cats. They have started gathering at my porch. Can we think of a spot that works for everyone?","Baik hati awak memberi kucing makan. Cuma kucing-kucing itu mula berkumpul di anjung saya. Boleh kita fikirkan tempat yang sesuai untuk semua?"),idea:L("Suggest one feeding spot away from the houses, cleaned after each feeding. Some councils and groups help with neutering.","Cadangkan satu tempat memberi makan yang jauh dari rumah, dibersihkan selepas setiap kali. Ada majlis perbandaran dan kumpulan yang membantu pemandulan.")},
 f1:{sc:L("Between friends, a loan is given on trust with no date. The borrower may be embarrassed and avoid the subject.","Antara kawan, pinjaman diberi atas dasar percaya tanpa tarikh. Peminjam mungkin malu dan mengelak daripada topik itu."),op:L("This is awkward for me to raise. About the money from March, I need it back. Can we agree on a way that you can manage?","Segan sebenarnya nak bangkitkan. Tentang wang dari bulan Mac, saya perlukannya semula. Boleh kita setuju cara yang mampu dibuat?"),idea:L("Offer instalments with a fixed date each month. In future, lend only what you can afford not to get back.","Tawarkan ansuran dengan tarikh tetap setiap bulan. Pada masa depan, pinjamkan hanya apa yang anda mampu jika tidak dipulangkan.")},
 f2:{sc:L("Many people take up direct selling, takaful or investment schemes for side income. They are taught to start with friends.","Ramai orang menceburi jualan langsung, takaful atau skim pelaburan untuk pendapatan sampingan. Mereka diajar untuk bermula dengan kawan."),op:L("I am glad you have found something you believe in. It is not for me, and I hope we can still meet as friends.","Saya gembira awak jumpa sesuatu yang awak yakin. Ia bukan untuk saya, dan saya harap kita masih boleh berjumpa sebagai kawan."),idea:L("Say no once, clearly and kindly. Then suggest meeting for something unrelated, like a meal.","Tolak sekali, dengan jelas dan baik. Kemudian cadangkan berjumpa untuk perkara lain, seperti makan bersama.")},
 f3:{sc:L("After school, people drift with work, family and distance. Being left out is often poor organising, not a decision about you.","Selepas sekolah, orang semakin jauh kerana kerja, keluarga dan jarak. Tercicir selalunya kerana penganjuran yang lemah, bukan keputusan tentang anda."),op:L("I saw the reunion photos. I would have loved to join. Please count me in for the next one.","Saya nampak gambar reunion. Saya memang nak ikut kalau tahu. Tolong masukkan nama saya untuk yang seterusnya."),idea:L("Offer to help organise the next gathering, or arrange a small one yourself with two or three friends.","Tawarkan diri membantu menganjurkan perjumpaan seterusnya, atau aturkan sendiri perjumpaan kecil dengan dua tiga kawan.")},
 f4:{sc:L("Old school friends keep the teasing style from their teenage years. What was funny at seventeen can hurt at forty-five.","Kawan lama sekolah mengekalkan gaya mengusik zaman remaja. Apa yang lucu pada usia tujuh belas boleh melukakan pada usia empat puluh lima."),op:L("I know it was meant as a joke. That one about my job stung a bit. Can we leave that topic out?","Saya tahu itu gurauan. Cuma yang tentang kerja saya tu terasa sikit. Boleh kita elakkan topik itu?"),idea:L("Tell them privately, not in the group. Most friends stop once they know.","Beritahu mereka secara peribadi, bukan dalam kumpulan. Kebanyakan kawan akan berhenti bila mereka tahu.")},
 f5:{sc:L("A friend who asks may be under pressure themselves, or may truly believe in the scheme. Friendship makes it hard to say no.","Kawan yang meminta mungkin sendiri sedang tertekan, atau benar-benar percaya pada skim itu. Persahabatan membuat sukar untuk menolak."),op:L("I value our friendship, so I will be direct. I do not act as a guarantor or invest with friends. I hope you understand.","Saya hargai persahabatan kita, jadi saya berterus terang. Saya tidak menjadi penjamin atau melabur dengan kawan. Harap awak faham."),idea:L("Check any scheme on the Bank Negara and Securities Commission alert lists before considering it.","Semak sebarang skim dalam senarai amaran Bank Negara dan Suruhanjaya Sekuriti sebelum mempertimbangkannya.")},
 f6:{sc:L("Work calls, children and traffic upset plans easily. Some people also say yes to every invitation and then cannot keep them all.","Panggilan kerja, anak dan kesesakan jalan mudah mengganggu rancangan. Ada juga orang yang kata ya kepada semua jemputan dan kemudian tidak dapat menunaikan semuanya."),op:L("I was looking forward to meeting. It has been cancelled a few times. Is there a day or time that is easier for you?","Saya memang menunggu nak berjumpa. Sudah beberapa kali batal. Ada hari atau masa yang lebih mudah untuk awak?"),idea:L("Choose a place near them and a shorter meeting, and confirm on the morning itself.","Pilih tempat yang dekat dengan mereka dan perjumpaan yang lebih pendek, dan sahkan pada pagi hari itu.")},
 f7:{sc:L("Some people share others' stories to feel close or to ask for advice, without thinking of it as breaking a trust.","Sesetengah orang berkongsi cerita orang lain untuk rasa rapat atau meminta nasihat, tanpa menganggapnya memecah amanah."),op:L("Something I told you in confidence came back to me from someone else. That hurt. Can you tell me what happened?","Perkara yang saya ceritakan secara sulit sampai semula kepada saya daripada orang lain. Saya terasa. Boleh ceritakan apa yang berlaku?"),idea:L("Say clearly 'this is between us' when sharing something private, and share according to how they have kept things before.","Sebut dengan jelas 'ini antara kita' bila berkongsi hal peribadi, dan kongsi mengikut cara mereka menjaga rahsia sebelum ini.")},
 f8:{sc:L("Group chats reward strong opinions. People write there what they would never say to a friend's face.","Kumpulan sembang menggalakkan pendapat yang keras. Orang menulis di situ apa yang mereka tidak akan kata di depan kawan."),op:L("We see this differently, and that is fine. Our friendship is older than this topic. Shall we leave it there?","Pandangan kita berbeza, dan itu tak mengapa. Persahabatan kita lebih lama daripada topik ini. Kita berhenti di sini ya?"),idea:L("Suggest a group rule: no politics, and keep religious debate out. Stop replying once it turns heated.","Cadangkan peraturan kumpulan: tiada politik, dan elakkan perdebatan agama. Berhenti membalas bila ia mula panas.")},
 su1:{sc:L("Committee members are volunteers, often long-serving and senior. A new proposal can feel like criticism of how things were run.","Ahli jawatankuasa ialah sukarelawan, selalunya sudah lama berkhidmat dan lebih senior. Cadangan baru boleh terasa seperti kritikan terhadap cara pengurusan sebelum ini."),op:L("I respect how much the committee has done. I have a small suggestion and would value your advice on it first.","Saya hormati usaha jawatankuasa selama ini. Saya ada satu cadangan kecil dan ingin minta nasihat dahulu."),idea:L("Discuss it privately with the chairman or one senior member before the meeting, and ask them to raise it.","Bincang secara tertutup dengan pengerusi atau seorang ahli senior sebelum mesyuarat, dan minta mereka yang bangkitkan.")},
 su2:{sc:L("Some people believe correcting on the spot is their duty. The intention may be sincere even when the way is hard to accept.","Sesetengah orang percaya menegur serta-merta ialah tanggungjawab mereka. Niatnya mungkin ikhlas walaupun caranya sukar diterima."),op:L("Thank you for pointing it out. I would like to understand it better. Could you explain it to me privately?","Terima kasih kerana menegur. Saya nak faham dengan lebih baik. Boleh terangkan kepada saya secara berdua?"),idea:L("Check the matter afterwards with the imam or a teacher you trust, calmly and in private.","Semak perkara itu kemudian dengan imam atau guru yang anda percayai, dengan tenang dan secara tertutup.")},
 su3:{sc:L("Most people work shifts or long hours and have family duties. Announcements after prayers reach only those who were there.","Kebanyakan orang bekerja syif atau waktu panjang dan ada tanggungjawab keluarga. Pengumuman selepas solat hanya sampai kepada yang hadir."),op:L("We could use more hands for the next gotong-royong. Is there a day or a task that would suit you?","Kami perlukan lebih ramai untuk gotong-royong seterusnya. Ada hari atau tugas yang sesuai?"),idea:L("Ask people personally and give a specific small task with a time, instead of a general call for volunteers.","Ajak orang secara peribadi dan beri tugas kecil yang khusus dengan masanya, bukan panggilan umum untuk sukarelawan.")},
 su5:{sc:L("Regular members notice an absence and may mention it out of concern. They do not see your shift, your travel or your family duties.","Ahli tetap perasan ketidakhadiran dan mungkin menyebutnya kerana ambil berat. Mereka tidak nampak syif, perjalanan atau tanggungjawab keluarga anda."),op:L("Thank you for noticing. I had work and family matters those days. InsyaAllah I will join when I can.","Terima kasih kerana ambil tahu. Saya ada urusan kerja dan keluarga pada hari-hari itu. InsyaAllah saya akan turut serta bila berkesempatan."),idea:L("Tell the organiser in advance when you cannot attend, and offer to help in another way, such as a contribution or a task you can do from home.","Maklumkan penganjur lebih awal bila tidak dapat hadir, dan tawarkan bantuan dengan cara lain, seperti sumbangan atau tugas yang boleh dibuat dari rumah.")},
 su6:{sc:L("Younger members bring new formats and technology. The seniors carry years of responsibility and worry about what the congregation will accept.","Ahli muda membawa format dan teknologi baru. Orang lama memikul tanggungjawab bertahun-tahun dan risau tentang apa yang jemaah akan terima."),op:L("We would like to help the surau, and we want to do it in a way the committee is comfortable with. What concerns you about the proposal?","Kami nak membantu surau, dengan cara yang jawatankuasa selesa. Apa yang merisaukan tentang cadangan itu?"),idea:L("Propose a small trial for one programme, with a senior member as adviser, and report the result.","Cadangkan percubaan kecil untuk satu program, dengan seorang ahli senior sebagai penasihat, dan laporkan hasilnya.")},
 su7:{sc:L("The treasurer is usually a volunteer doing accounts by hand after work. A late report is more often workload than wrongdoing.","Bendahari biasanya sukarelawan yang membuat akaun secara manual selepas waktu kerja. Laporan yang lewat lebih kerap kerana beban kerja, bukan salah laku."),op:L("I appreciate the work on the accounts. Some of us were asking about the monthly report. Is there anything I can help with to get it out?","Saya hargai kerja menguruskan akaun. Ada beberapa orang bertanya tentang laporan bulanan. Ada apa-apa yang saya boleh bantu untuk siapkannya?"),idea:L("Offer practical help, such as a simple spreadsheet or a monthly summary on the notice board.","Tawarkan bantuan praktikal, seperti hamparan mudah atau ringkasan bulanan di papan kenyataan.")},
 su8:{sc:L("Differences in practice have existed among scholars for centuries. Each person follows what their teachers taught and feels responsible for it.","Perbezaan amalan sudah wujud dalam kalangan ulama berabad-abad. Setiap orang mengikut apa yang diajar oleh guru mereka dan rasa bertanggungjawab terhadapnya."),op:L("We may follow different views on this, and both have their scholars. I would rather keep our brotherhood than win the point.","Kita mungkin mengikut pandangan yang berbeza dalam hal ini, dan kedua-duanya ada sandaran ulama. Saya lebih rela menjaga ukhuwah daripada menang hujah."),idea:L("Refer the question to the imam or the mufti's office, and do not debate it in front of the congregation.","Rujuk persoalan itu kepada imam atau pejabat mufti, dan jangan berdebat di depan jemaah.")},
 su9:{sc:L("Members support different parties, and feelings run high near elections. The surau is one of the few places where everyone still meets.","Ahli jemaah menyokong parti yang berbeza, dan perasaan memuncak menjelang pilihan raya. Surau ialah antara sedikit tempat di mana semua orang masih bertemu."),op:L("We may vote differently, but we pray in the same row. Can we keep politics outside so everyone feels welcome here?","Kita mungkin mengundi berbeza, tetapi kita solat dalam saf yang sama. Boleh kita tinggalkan politik di luar supaya semua rasa dialu-alukan di sini?"),idea:L("Suggest that the committee states a simple rule: no party talk or symbols in surau programmes.","Cadangkan supaya jawatankuasa menyatakan satu peraturan mudah: tiada ceramah atau lambang parti dalam program surau.")}
};

/* =====================================================================
   9. State and storage
   ===================================================================== */
const KEY="habitsCoach.v1";
let S={lang:"en",cases:[]};      // saved state
let V={name:"home"};             // current screen
let C=null;                      // current case
let COPY=[];                     // texts for the copy buttons on this screen
try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&Array.isArray(r.cases))S=r;}catch(e){}
if(S.me&&!(STYLE[S.me.style]&&Array.isArray(S.me.top)&&Array.isArray(S.me.low)))delete S.me;   // drop a result saved in an older format
S.cases=S.cases.filter(c=>c&&SIT[c.sit]&&CAT[c.cat]);   // drop saved cases whose situation no longer exists
S.cases.forEach(c=>{if(c.their&&!STYLE[c.their])delete c.their;});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const t=x=>x[S.lang==="bm"?1:0];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
const isSelf=c=>CAT[c.cat].tone==="self";

/* ---------- Question queue: follow-up questions are inserted after the answer that triggers them ---------- */
function queue(c){
  const q=[...SIT[c.sit].q];
  for(let i=0;i<c.ans.length&&i<q.length;i++){
    const f=Q[q[i]][c.ans[i]].f;
    if(f&&!q.includes(f))q.splice(i+1,0,f);
  }
  return q;
}
/* ---------- Scoring: add the points of every answer, highest cause first ---------- */
function rank(c){
  const order=isSelf(c)?SORDER:ORDER, def=isSelf(c)?SDEF:DEF, sc={}, q=queue(c);
  order.forEach(k=>sc[k]=0);
  c.ans.forEach((a,i)=>{const p=Q[q[i]][a].p;for(const k in p)sc[k]+=p[k];});
  const top=Math.max(...order.map(k=>sc[k]));
  c.flat=top===0;
  c.rank=c.flat?def.concat(order.filter(k=>!def.includes(k))):order.slice().sort((x,y)=>sc[y]-sc[x]);
  c.second=!c.flat&&sc[c.rank[1]]>0;
  c.ci=0;
}
/* ---------- Response steps for the current cause ---------- */
function steps(c){
  const cz=cau(c,c.rank[c.ci]), tone=CAT[c.cat].tone;
  if(tone==="self")return cz.steps.map(s=>({h:s[0],t:s[1],x:s[2],say:false,ic:HIC[s[0]]}));
  return [{h:5,t:T.s_open,x:cz.open[tone],say:true,ic:"ear"},{h:2,t:T.s_need,x:TONE[tone].need,say:true,ic:"target"},
          {h:4,t:T.s_win,x:cz.win,say:true,ic:"win"},{h:3,t:T.s_next,x:TONE[tone].next,say:true,ic:"next"}];
}
/* ---------- Which screen a saved case should open on ---------- */
function viewOf(c){
  if(c.stage==="q")return "q";
  if(c.stage==="why")return "why";
  if(c.stage==="respond")return c.step===-2?"their":c.step===-3?"mine":c.step<0?"calm":c.step>=steps(c).length?"ready":"step";
  if(c.stage==="react")return "react";
  return "good";
}
const go=n=>{V={name:n};render();};
const goCase=()=>{save();go(viewOf(C));};

/* =====================================================================
   10. Screens
   ===================================================================== */
const row=(a,b,small,right,left)=>`<button class="row" data-a="${a}">${left?`<span class="badge sm">${ic(left)}</span>`:""}<span class="g"><b>${b}</b>${small?`<small>${small}</small>`:""}</span>${right||'<span class="chev">&#8250;</span>'}</button>`;
const ab=(a,k,txt)=>`<button class="ab" data-a="${a}"><i>${k}</i><span>${txt}</span></button>`;
const sayBox=(txt,cls)=>{COPY.push(txt);return `<div class="say ${cls||""}">${esc(txt)}</div>`;};
const copyBtn=()=>`<button class="cp" data-a="copy:${COPY.length-1}">${t(T.copy)}</button>`;
const fmtDate=ts=>new Date(ts).toLocaleDateString(S.lang==="bm"?"ms-MY":"en-GB",{day:"numeric",month:"short"});

/* Which section each screen belongs to (sets the background colour) */
const SEC={home:"home",grp:"home",cat:"home",pause:"q",q:"q",why:"why",calm:"respond",reset:"respond",step:"respond",ready:"respond",react:"follow",retry:"follow",good:"follow",data:"data",disc:"style",dq:"style",their:"style",tq:"style",mine:"style"};
function render(){
  COPY=[];let h="";const v=V.name;
  document.documentElement.lang=S.lang==="bm"?"ms":"en";
  $("ttl").textContent=t(T.app);$("lang").textContent=S.lang==="bm"?"EN":"BM";$("back").hidden=v==="home";
  $("homeb").hidden=v==="home";                    // Home button: leave to the home screen from anywhere, the case stays saved
  $("homeb").setAttribute("aria-label",t(T.home));
  // background colour follows the section, and the phone status bar colour follows it too
  document.documentElement.dataset.sec=SEC[v]||"home";
  const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.content=getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();

  if(v==="home"){
    h+=`<h2>${t(T.intro)}</h2><p class="mute">${t(T.purpose)}</p>`;
    if(S.cases.length){
      h+=`<h3>${t(T.mine)}</h3>`;
      S.cases.slice().sort((a,b)=>b.ts-a.ts).forEach(c=>{
        const hint=t(T["h_"+(c.stage==="done"?"done":c.stage)]);
        // each case: the row opens it, the bin button beside it deletes it
        h+=`<div class="crow">`+row("open:"+c.id,esc(c.label||t(SIT[c.sit].n)),`${t(CAT[c.cat].n)} · ${fmtDate(c.ts)} · ${hint}`,`<span class="chip ${c.status}">${t(T["st_"+c.status])}</span>`)
          +`<button class="del" data-a="del:${c.id}" aria-label="${t(T.del)}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg></button></div>`;
      });
      if(S.cases.length>1)h+=`<button class="btn txt" style="margin-top:0" data-a="clear">${t(T.clear)}</button>`;
    }
    h+=`<h3>${t(T.whoabout)}</h3>`;
    for(const g in GROUP)h+=row("grp:"+g,t(GROUP[g].n),t(GROUP[g].d),"",g);
    h+=row("cat:self",t(CAT.self.n),t(CAT.self.d),"","self");
    h+=`<h3>${t(TD.home)}</h3>`+row("disc",t(TD.row),S.me?sname(S.me.style):t(TD.row_new),"",S.me?S.me.style:"win");
    h+=`<button class="btn txt" data-a="data">${t(T.data)}</button><p class="mute">${t(T.a2hs)}</p><p class="mute">${t(T.credit)}</p>`;
  }

  else if(v==="grp"){
    const g=GROUP[V.grp];
    h+=`<span class="tag">${t(g.n)}</span><h2>${t(T.whoabout)}</h2>`;
    g.cats.forEach(k=>{h+=row("cat:"+k,t(CAT[k].n),t(CAT[k].d),"",k);});
    if(g.note)h+=`<p class="mute">${t(g.note)}</p>`;
  }

  else if(v==="cat"){
    h+=`<span class="tag">${t(CAT[V.cat].n)}</span><h2>${t(T.pick)}</h2>`;
    for(const k in SIT)if(SIT[k].c===V.cat)h+=row("sit:"+k,t(SIT[k].n));
    if(CAT[V.cat].note)h+=`<p class="mute">${t(CAT[V.cat].note)}</p>`;
  }

  else if(v==="pause"){
    const s=SIT[V.sit];
    h+=`<span class="tag">${t(HABIT[1])}</span><h2>${t(T.pause)}</h2><p>${t(T.pause_t)}</p>
    <div class="card"><p class="mute il">${ic("fact")}${t(T.fact)}</p><div class="say">${t(s.fact)}</div><p class="mute il">${ic("label")}${t(T.lab)}</p><div class="say no" style="margin-bottom:0">${t(s.label)}</div></div>
    <p class="mute">${t(T.pause_n)}</p>
    <h3><label for="lbl">${t(T.lbl)}</label></h3><input type="text" id="lbl" maxlength="30" placeholder="${t(T.lbl_p)}" autocomplete="off"><p class="mute" style="margin-top:6px">${t(T.lbl_n)}</p>
    <button class="btn" data-a="start">${t(T.start)}</button>`;
  }

  else if(v==="q"){
    const q=queue(C), i=C.ans.length, qq=Q[q[i]];
    h+=`<p class="mute">${esc(C.label||t(SIT[C.sit].n))} · ${i+1} ${t(T.of)} ${q.length}</p><div class="prog"><div style="width:${Math.round(i/q.length*100)}%"></div></div>
    <h2>${t(qq.q)}</h2>${ab("ans:a","A",t(qq.a.t))}${ab("ans:b","B",t(qq.b.t))}`;
  }

  else if(v==="why"){
    const cz=cau(C,C.rank[C.ci]);
    h+=`<span class="tag">${t(HABIT[5])}</span>`;
    if(C.flat&&C.ci===0)h+=`<p class="mute">${t(T.flat)}</p>`;
    h+=`<div class="card warm"><div class="hero" style="margin-bottom:12px">${big(C.rank[C.ci])}<div><p class="mute" style="margin:0">${t(T.why1)}</p><h2 style="margin:0">${t(cz.n)}</h2></div></div><p style="margin:0">${t(cz.why)}</p></div>
    ${SX[C.sit]?`<div class="card"><p class="mute il">${ic("fact")}${t(T.insit)}</p><p style="margin:0">${t(SX[C.sit].sc)}</p></div>`:""}
    <div class="card"><p class="mute il">${ic("reframe")}${t(T.reframe)}</p><p style="margin:0">${t(cz.re)}</p></div>`;
