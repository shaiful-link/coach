    if(C.second&&C.ci===0)h+=`<p class="mute">${t(T.why2)}: <b>${t(cau(C,C.rank[1]).n)}</b></p>`;
    h+=`<p class="mute">${t(T.guess)}</p><button class="btn" data-a="respond">${t(T.torespond)}</button><button class="btn sec" data-a="nextr">${t(T.other)}</button>`;
  }

  else if(v==="calm"){
    h+=`${big("calm")}<span class="tag">${t(HABIT[1])}</span><h2>${t(T.calm)}</h2>${ab("calm:a","A",t(T.calm_a))}${ab("calm:b","B",t(T.calm_b))}`;
  }

  else if(v==="reset"){
    h+=`${big("calm")}<span class="tag">${t(HABIT[1])}</span><h2>${t(T.reset)}</h2><div class="card"><ul>${T.reset_l.map(x=>`<li>${t(x)}</li>`).join("")}</ul></div>
    <button class="btn" data-a="calm:a">${t(T.calmnow)}</button><button class="btn sec" data-a="home">${t(T.later)}</button>`;
  }

  else if(v==="step"){
    const st=steps(C), s=st[C.step];
    h+=`<p class="mute">${t(T.step)} ${C.step+1} ${t(T.of)} ${st.length} · ${t(cau(C,C.rank[C.ci]).n)}</p><div class="prog"><div style="width:${Math.round((C.step+1)/st.length*100)}%"></div></div>
    ${big(s.ic)}<span class="tag">${t(HABIT[s.h])}</span><h2>${t(s.t)}</h2>`;
    const sx=SX[C.sit]||{}, op=C.step===0&&s.say&&sx.op;
    if(op)h+=`<div class="card"><p class="mute">${t(T.startw)}</p>${sayBox(t(sx.op))}${copyBtn()}</div>`;
    if(s.say)h+=`<div class="card"><p class="mute">${t(op?T.thenask:T.sayit)}</p>${sayBox(t(s.x))}${copyBtn()}</div>${/\[/.test(t(s.x)+(op?t(sx.op):""))?`<p class="mute">${t(T.brackets)}</p>`:""}`;
    if(C.step===2&&s.say&&sx.idea)h+=`<div class="card"><p class="mute il">${ic("bulb")}${t(T.idea)}</p><p style="margin:0">${t(sx.idea)}</p></div>`;
    // tip tailored to the other person's conflict style, when it has been set for this case
    if(s.say&&C.their)h+=`<div class="card warm tipc">${sb(C.their)}<p><span class="mute">${t(TD.tip)} ${sname(C.their)}</span><br>${t(STYLE[C.their].tips[C.step])}</p></div>`;
    else h+=`<div class="card"><p style="margin:0;font-size:19px">${t(s.x)}</p></div>`;
    h+=`<button class="btn" data-a="next">${t(T.next)}</button>`;
  }

  else if(v==="ready"){
    const cz=cau(C,C.rank[C.ci]), self=isSelf(C);
    h+=`${big("check")}<h2>${t(T.ready)}</h2><div class="card stop"><p class="lab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>${t(self?T.avoid_s:T.avoid)}</p><div class="say no" style="margin-bottom:0">${t(cz.avoid)}</div></div>`;
    if(!self)h+=`<div class="card"><p class="mute il">${ic("msg")}${t(T.asmsg)}</p>${sayBox(t(cz.msg))}${copyBtn()}</div>`;
    // conflict styles: theirs (set per case) and yours (from the test)
    if(!self)h+=`<div class="card tipc">${sb(C.their)}<p><span class="mute">${t(TD.theirs)}</span><br>${C.their?t(STYLE[C.their].n):t(TD.unknown)}</p><button class="cp" data-a="tchange">${t(C.their?TD.change:TD.set)}</button></div>`;
    if(self&&SX[C.sit])h+=`<div class="card"><p class="mute il">${ic("bulb")}${t(T.idea)}</p><p style="margin:0">${t(SX[C.sit].idea)}</p></div>`;
    if(S.me)h+=`<div class="card tipc">${sb(S.me.style)}<p><span class="mute">${t(TD.yours)}: ${sname(S.me.style)}</span><br>${t(STYLE[S.me.style].me)}</p></div>`;
    else if(!self)h+=`<div class="card tipc"><span class="badge sm">?</span><p><span class="mute">${t(TD.yours)}</span><br>${t(TD.unknown)}</p><button class="cp" data-a="mchange">${t(TD.set)}</button></div>`;
    // both styles known: what tends to happen between the two, and what to do about it
    if(!self&&S.me&&C.their)h+=`<div class="card warm"><p class="mute">${t(TD.pair)}</p><div class="tipc" style="margin-bottom:10px">${sb(S.me.style)}<p class="mute" style="flex:none">${t(TD.you)}</p>${sb(C.their)}<p class="mute">${t(TD.them)}</p></div><p style="margin:0">${t(PAIR[S.me.style][C.their])}</p></div>`;
    h+=`<div class="card warm"><p class="mute il">${ic("bulb")}${t(T.remember)}</p><p style="margin:0">${t(CAT[C.cat].tip)}</p></div>
    <button class="btn" data-a="savego">${t(T.savego)}</button><p class="mute" style="margin-top:10px">${t(self?T.savego_ns:T.savego_n)}</p>`;
  }

  else if(v==="react"){
    const self=isSelf(C);
    h+=`<p class="mute">${esc(C.label||t(SIT[C.sit].n))} · ${t(cau(C,C.rank[C.ci]).n)}</p><h2>${t(self?T.react_s:T.react)}</h2>
    ${ab("react:a","A",t(self?T.react_sa:T.react_a))}${ab("react:b","B",t(self?T.react_sb:T.react_b))}
    <button class="btn txt" data-a="again">${t(T.again)}</button><button class="btn txt" data-a="del:${C.id}">${t(T.del)}</button>`;
  }

  else if(v==="good"){
    const self=isSelf(C);
    h+=`<span class="tag">${t(HABIT[7])}</span><h2>${t(self?T.st_resolved:T.good)}</h2>
    <div class="card">${self?`<p style="margin:0">${t(T.good_s)}</p>`:`<ul style="margin:0">${T.good_l.map(x=>`<li>${t(x)}</li>`).join("")}</ul>`}</div>
    <p class="mute">${t(T.why1)}: <b>${t(cau(C,C.rank[C.ci]).n)}</b></p>
    <button class="btn" data-a="home">${t(T.home)}</button><button class="btn txt" data-a="del:${C.id}">${t(T.del)}</button>`;
  }

  else if(v==="retry"){
    const cz=cau(C,C.rank[C.ci]), self=isSelf(C), nx=cau(C,C.rank[(C.ci+1)%C.rank.length]);
    h+=`<span class="tag">${t(HABIT[self?1:5])}</span><h2>${t(self?T.retry_s:T.retry)}</h2><div class="card"><p style="margin:0">${t(cz.retry)}</p></div>`;
    if(V.esc)h+=`<div class="card warm"><p class="mute">${t(T.esc)}</p><p style="margin:0">${t(TONE[CAT[C.cat].tone].esc)}</p></div>`;
    h+=`<button class="btn" data-a="nextr">${t(T.nextr)}: ${t(nx.n)}</button>`;
    if(!self&&!V.esc)h+=`<button class="btn sec" data-a="esc">${t(T.esc)}</button>`;
    h+=`<button class="btn txt" data-a="home">${t(T.close)}</button>`;
  }

  else if(v==="disc"){
    const m=S.me, li=a=>`<ul style="margin:0">${a.map(x=>`<li>${t(x)}</li>`).join("")}</ul>`;
    if(!m){
      h+=`<span class="tag">${t(HABIT[4])}</span><h2>${t(TD.intro_h)}</h2><p>${t(TD.intro_t)}</p>
      <div class="card">${SORD.map(k=>`<div class="srow">${sb(k)}<p><b>${t(STYLE[k].n)}</b><br><span class="mute">${t(STYLE[k].sh)}</span></p></div>`).join("")}</div>
      <p class="mute">${t(TD.intro_n)}</p><button class="btn" data-a="dstart">${t(TD.start)}</button><p class="mute" style="margin-top:14px">${t(TD.note)}</p>`;
    }else{
      const z=STYLE[m.style], others=m.top.slice(1), lw=m.low.filter(k=>!m.top.includes(k))[0];
      h+=`<span class="tag">${t(TD.mine)}</span><div class="card"><div class="hero">${sb(m.style,1)}<div><h2>${t(z.n)}</h2><p style="margin:0">${t(z.sh)}</p></div></div>
      ${others.length?`<p class="mute" style="margin:12px 0 0">${t(TD.tie)} <b>${others.map(sname).join(", ")}</b></p>`:""}</div>
      ${m.n?`<div class="card"><p class="mute">${t(TD.scores)}</p>${SORD.map(k=>`<div class="meter"><span>${m.top.includes(k)?`<b>${t(STYLE[k].n)}</b>`:t(STYLE[k].n)}</span><div class="bar" role="img" aria-label="${t(STYLE[k].n)}: ${m.n[k]} / ${DMAX}"><div style="width:${Math.round(m.n[k]/DMAX*100)}%"></div></div><span>${m.n[k]}</span></div>`).join("")}</div>`:`<div class="card"><p style="margin:0">${t(TD.picked)}</p><button class="btn" data-a="dstart">${t(TD.start)}</button></div>`}
      <div class="card"><p class="mute">${t(TD.wk)}</p>${li(z.wk)}</div>
      <div class="card"><p class="mute">${t(TD.co)}</p>${li(z.co)}</div>
      <div class="card warm"><p class="mute">${t(TD.me)}</p><p style="margin:0">${t(z.me)}</p></div>`;
      if(lw)h+=`<div class="card"><p class="mute">${t(TD.low)}</p><div class="tipc" style="margin-bottom:10px">${sb(lw)}<p><b>${t(STYLE[lw].n)}</b></p></div><p class="mute">${t(TD.low_t)}</p>${li(STYLE[lw].wk)}</div>`;
      h+=`<p>${t(TD.key)}</p>
      <h3>${t(TD.wi)}</h3><div class="card">${SORD.map(k=>`<div class="srow">${sb(k)}<p><b>${t(STYLE[k].n)}</b>${k===m.style?` <span class="mute">(${t(TD.same)})</span>`:""}<br>${t(STYLE[k].wi)}</p></div>`).join("")}</div>
      <button class="btn sec" data-a="dstart">${t(TD.retake)}</button><button class="btn txt" data-a="dclear">${t(TD.clear)}</button><p class="mute">${t(TD.note)}</p>`;
    }
  }

  else if(v==="dq"){
    const i=V.ans.length, d=DQ[i];
    h+=`<p class="mute">${t(TD.row)} · ${i+1} ${t(T.of)} ${DQ.length}</p><div class="prog"><div style="width:${Math.round(i/DQ.length*100)}%"></div></div>
    <h2>${t(TD.q)}</h2>${ab("dans:a","A",t(STYLE[d[0]].qs[d[1]]))}${ab("dans:b","B",t(STYLE[d[2]].qs[d[3]]))}`;
  }

  else if(v==="their"){
    h+=`<span class="tag">${t(HABIT[5])}</span><h2>${t(TD.their_h)}</h2><p>${t(TD.their_t)}</p>`;
    SORD.forEach(k=>{h+=`<button class="row" data-a="their:${k}">${sb(k)}<span class="g"><b>${t(STYLE[k].n)}</b><small>${t(STYLE[k].sh).replace(/\bI\b/g,"They").replace(/\bMy\b/g,"Their").replace(/\bmy\b/g,"their").replace(/\bSaya\b/g,"Mereka").replace(/\bsaya\b/g,"mereka")}</small></span></button>`;});
    h+=`<button class="btn sec" data-a="tguess">${t(TD.guess)}</button><button class="btn txt" data-a="their:">${t(TD.skip)}</button>`;
  }

  else if(v==="mine"){
    h+=`<span class="tag">${t(HABIT[1])}</span><h2>${t(TD.mine_h)}</h2><p>${t(TD.mine_t)}</p>`;
    SORD.forEach(k=>{h+=`<button class="row" data-a="mine:${k}">${sb(k)}<span class="g"><b>${t(STYLE[k].n)}</b><small>${t(STYLE[k].sh)}</small></span></button>`;});
    h+=`<button class="btn sec" data-a="mtest">${t(TD.mine_test)}</button><button class="btn txt" data-a="mine:">${t(TD.skip)}</button>`;
  }

  else if(v==="tq"){
    const i=V.ans.length;
    h+=`<p class="mute">${t(TD.their_h)} · ${i+1} ${t(T.of)} 2</p><div class="prog"><div style="width:${i*50}%"></div></div>
    <h2>${t(i?TD.tq2:TD.tq1)}</h2>${ab("tans:a","A",t(i?TD.tq2a:TD.tq1a))}${ab("tans:b","B",t(i?TD.tq2b:TD.tq1b))}`;
  }

  else if(v==="data"){
    h+=`<h2>${t(T.data)}</h2><p>${t(T.data_t)}</p><p class="mute">${S.cases.length?S.cases.length+" "+t(T.mine).toLowerCase():t(T.nocase)}</p>
    <button class="btn" data-a="exp">${t(T.exp)}</button><button class="btn sec" data-a="imp">${t(T.imp)}</button><button class="btn bad" data-a="clear">${t(T.clear)}</button>`;
  }

  $("app").innerHTML=h;
  window.scrollTo(0,0);
}

/* =====================================================================
   11. Actions
   ===================================================================== */
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1500);}
function copyText(s){
  const ok=()=>toast(t(T.copied));
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(ok,()=>fallback());}else fallback();
  function fallback(){const a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok();}catch(e){}a.remove();}
}
function removeCase(id){S.cases=S.cases.filter(c=>c.id!==id);save();}

/* After their style is set: ask my own style if it is not known yet, otherwise go to the calm check */
const afterTheir=()=>(!S.me&&!C.mq)?-3:-1;
function act(a){
  const i=a.indexOf(":"), name=i<0?a:a.slice(0,i), arg=i<0?"":a.slice(i+1);
  switch(name){
    case "lang": S.lang=S.lang==="bm"?"en":"bm";save();render();break;
    case "home": save();C=null;go("home");break;
    case "data": go("data");break;
    case "grp": V={name:"grp",grp:arg};render();break;
    case "cat": V={name:"cat",cat:arg};render();break;
    case "sit": V={name:"pause",sit:arg,cat:SIT[arg].c};render();break;
    case "start":                                  // create and save a new case
      C={id:Date.now().toString(36),cat:SIT[V.sit].c,sit:V.sit,label:$("lbl").value.trim(),ts:Date.now(),ans:[],rank:[],ci:0,stage:"q",step:0,status:"open"};
      S.cases.push(C);goCase();break;
    case "ans":                                    // record A or B, then score when all are answered
      C.ans.push(arg);
      if(C.ans.length>=queue(C).length){rank(C);C.stage="why";}
      goCase();break;
    case "respond": C.stage="respond";C.step=isSelf(C)?0:(C.their===undefined?-2:afterTheir());goCase();break;   // first time: ask their conflict style
    case "calm": if(arg==="a"){C.step=0;goCase();}else go("reset");break;
    case "next": C.step++;goCase();break;
    case "savego": C.stage="react";save();C=null;go("home");break;
    case "open": C=S.cases.find(c=>c.id===arg);if(C)go(viewOf(C));break;
    case "again": C.stage="respond";C.step=0;goCase();break;
    case "react":
      if(arg==="a"){C.status="resolved";C.stage="done";goCase();}
      else{C.status="tried";save();go("retry");}
      break;
    case "nextr": C.ci=(C.ci+1)%C.rank.length;C.stage="why";goCase();break;
    case "esc": V={name:"retry",esc:true};render();break;
    case "copy": copyText(COPY[+arg]);break;
    case "del": if(confirm(t(T.del_q))){removeCase(arg);C=null;go("home");}break;
    case "clear": if(S.cases.length&&confirm(t(T.clear_q))){S.cases=[];save();render();}break;
    case "exp":{                                   // download the cases as a small JSON file
      const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),u=URL.createObjectURL(b),l=document.createElement("a");
      l.href=u;l.download="habits-coach-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);break;}
    case "imp": $("imp").click();break;
    /* --- conflict style test --- */
    case "disc": go("disc");break;
    case "dstart": V={name:"dq",ans:[]};render();break;
    case "dans":
      V.ans.push(arg);
      if(V.ans.length>=DQ.length){
        const ret=V.ret&&C;S.me=scoreStyle(V.ans);save();
        if(ret){C.mq=1;C.step=-1;toast(t(TD.saved)+": "+sname(S.me.style));goCase();}else go("disc");
      }else render();
      break;
    case "dclear": if(confirm(t(TD.clear_q))){delete S.me;save();render();}break;
    /* --- the other person's conflict style, per case ("" means skipped) --- */
    case "their": C.their=arg;C.step=afterTheir();goCase();break;
    /* --- my own style, asked once when the test has not been taken ("" means skipped for this case) --- */
    case "mine":
      if(arg){S.me={style:arg,top:[arg],low:[],n:null,ts:Date.now()};toast(t(TD.saved));}
      C.mq=1;C.step=-1;goCase();break;
    case "mtest": save();V={name:"dq",ans:[],ret:1};render();break;   // take the test, then come back to this case
    case "mchange": C.stage="respond";C.mq=0;C.step=-3;goCase();break;
    case "tguess": V={name:"tq",ans:[]};render();break;
    case "tans":
      V.ans.push(arg);
      if(V.ans.length>=2){C.their=styleOf(V.ans[0]==="a",V.ans[1]==="a");C.step=afterTheir();goCase();}else render();
      break;
    case "tchange": C.stage="respond";C.step=-2;goCase();break;
    case "back": back();break;
  }
}
/* ---------- Back button: one step back on every screen ---------- */
function back(){
  const v=V.name;
  if(v==="cat"&&groupOf(V.cat)){V={name:"grp",grp:groupOf(V.cat)};return render();}
  if(v==="cat"||v==="grp"||v==="data"||v==="react"||v==="good"||v==="disc")return act("home");
  if(v==="dq"){if(V.ans.length){V.ans.pop();return render();}if(V.ret&&C)return goCase();return go("disc");}
  if(v==="mine"){C.step=-2;return goCase();}
  if(v==="their"){C.stage="why";return goCase();}
  if(v==="tq"){if(V.ans.length){V.ans.pop();return render();}return go("their");}
  if(v==="pause"){V={name:"cat",cat:V.cat};return render();}
  if(v==="q"){
    if(C.ans.length){C.ans.pop();return goCase();}
    const s=C.sit;removeCase(C.id);C=null;V={name:"pause",sit:s,cat:SIT[s].c};return render();   // nothing answered yet: drop the empty case
  }
  if(v==="why"){
    if(C.ci>0){C.ci--;return goCase();}
    C.ans.pop();C.stage="q";return goCase();
  }
  if(v==="calm"){C.stage="why";return goCase();}
  if(v==="reset")return go("calm");
  if(v==="step"){
    if(C.step>0)C.step--;else if(!isSelf(C))C.step=-1;else C.stage="why";
    return goCase();
  }
  if(v==="ready"){C.step=steps(C).length-1;return goCase();}
  if(v==="retry")return go("react");
  act("home");
}

/* ---------- Wire up ---------- */
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b)act(b.dataset.a);});
$("imp").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      const good=d&&Array.isArray(d.cases)&&d.cases.every(c=>c&&SIT[c.sit]&&CAT[c.cat]&&Array.isArray(c.ans)&&Array.isArray(c.rank)&&c.rank.every(k=>CAUSE[k])&&(!c.their||STYLE[c.their]));
      if(!good)throw 0;
      if(confirm(t(T.imp_q))){const me=d.me&&STYLE[d.me.style]&&Array.isArray(d.me.top)&&Array.isArray(d.me.low)?d.me:S.me;S={lang:S.lang,cases:d.cases};if(me)S.me=me;save();C=null;go("home");toast(t(T.imp_ok));}
    }catch(x){toast(t(T.imp_bad));}
    e.target.value="";
  };
  r.readAsText(f);
});
/* Offline support: only works when the page is served over https (GitHub Pages) */
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
